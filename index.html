<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#040a16">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SYSTEM - Hệ thống Siêu Học Bá</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/x-icon" href="icon.ico">
<style>
:root {
  --abyss: #040a16;
  --deep: #081a35;
  --edge: #35c8ff;
  --edge-dim: rgba(53, 200, 255, .28);
  --ice: #dff4ff;
  --mist: #7fa3c4;
  --gold: #ffd36b;
  --alert: #ff5a6e;
  --ok: #5af0b4;
  --glass: linear-gradient(180deg, rgba(14, 44, 90, .58), rgba(5, 16, 38, .62));
  --display: "Bahnschrift", "Segoe UI Semibold", "Segoe UI", sans-serif;
  --body: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background:
    radial-gradient(1100px 600px at 70% -10%, rgba(30, 110, 220, .28), transparent 60%),
    radial-gradient(800px 500px at -10% 110%, rgba(20, 80, 180, .22), transparent 60%),
    var(--abyss);
  color: var(--ice);
  font: 15px/1.5 var(--body);
  overflow: hidden;
}
body::before { /* lưới mờ phía sau, giống màn hình hệ thống */
  content: ""; position: fixed; inset: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(53, 200, 255, .04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(53, 200, 255, .04) 1px, transparent 1px);
  background-size: 44px 44px;
}
button, input, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, .card:focus-visible {
  outline: 2px solid var(--edge); outline-offset: 2px;
}
.hidden { display: none !important; }

#app { position: relative; display: grid; grid-template-columns: 188px 1fr; grid-template-rows: minmax(0, 1fr); height: 100%; }

/* ---------- thanh điều hướng ---------- */
.rail { min-height: 0; overflow-y: auto; padding: 22px 14px; display: flex; flex-direction: column; gap: 6px; border-right: 1px solid var(--edge-dim); background: rgba(3, 10, 24, .55); }
.brand { font: 700 26px/1 var(--display); letter-spacing: .14em; color: var(--edge); text-shadow: 0 0 18px rgba(53, 200, 255, .7); padding: 4px 10px 22px; }
.nav { text-align: left; background: none; border: 1px solid transparent; border-radius: 4px; padding: 10px 12px; cursor: pointer; color: var(--mist); font-family: var(--display); font-size: 16px; }
.nav:hover { color: var(--ice); background: rgba(53, 200, 255, .07); }
.nav.on { color: var(--ice); border-color: var(--edge-dim); background: linear-gradient(90deg, rgba(53, 200, 255, .18), transparent); box-shadow: inset 3px 0 0 var(--edge); }
.rail-foot { margin-top: auto; padding: 10px; color: var(--mist); font: 15px var(--display); }
.rail-foot b { display: block; font-size: 26px; color: var(--ice); font-weight: 600; }

/* ---------- khung chính ---------- */
main { display: flex; flex-direction: column; min-width: 0; min-height: 0; height: 100%; padding: 18px 22px 0; gap: 16px; }
#view { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 6px 28px 2px; }
#view::-webkit-scrollbar, .modal-box::-webkit-scrollbar { width: 8px; }
#view::-webkit-scrollbar-thumb, .modal-box::-webkit-scrollbar-thumb { background: var(--edge-dim); border-radius: 4px; }

/* Khung kính có góc sáng: nét nhận diện chính của giao diện */
.panel {
  position: relative; background: var(--glass); border: 1px solid var(--edge-dim);
  box-shadow: 0 0 22px rgba(53, 200, 255, .09), inset 0 0 26px rgba(53, 200, 255, .05);
  backdrop-filter: blur(8px);
}
.panel::before, .panel::after { content: ""; position: absolute; width: 14px; height: 14px; border: 2px solid var(--edge); pointer-events: none; filter: drop-shadow(0 0 4px var(--edge)); }
.panel::before { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
.panel::after { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

.status { flex: none; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 22px; padding: 14px 22px; }
.lv { font: 700 44px/1 var(--display); color: var(--edge); text-shadow: 0 0 16px rgba(53, 200, 255, .7); }
.lv small { display: block; font: 13px var(--body); color: var(--mist); text-shadow: none; }
.xpbar { height: 10px; background: rgba(53, 200, 255, .12); border: 1px solid var(--edge-dim); border-radius: 2px; overflow: hidden; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, #1b6fe0, var(--edge)); box-shadow: 0 0 10px var(--edge); transition: width .5s ease; }
.xpline { display: flex; justify-content: space-between; color: var(--mist); font-size: 13px; margin-bottom: 4px; }
.pts { text-align: right; font: 600 30px/1 var(--display); color: var(--gold); text-shadow: 0 0 14px rgba(255, 211, 107, .45); }
.pts small { display: block; font: 13px var(--body); color: var(--mist); text-shadow: none; }

h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; }
h1 { font-size: 28px; }
h2 { font-size: 20px; color: var(--ice); }
.sub { color: var(--mist); margin: 4px 0 0; max-width: 62ch; }
.row { display: flex; align-items: center; gap: 12px; }
.row.between { justify-content: space-between; }
.section { margin-top: 26px; }
.section > h2 { margin-bottom: 12px; }

/* ---------- nút ---------- */
.btn { background: rgba(53, 200, 255, .1); border: 1px solid var(--edge); border-radius: 3px; padding: 8px 16px; cursor: pointer; font-family: var(--display); font-size: 15px; transition: background .15s, box-shadow .15s; }
.btn:hover { background: rgba(53, 200, 255, .24); box-shadow: 0 0 14px rgba(53, 200, 255, .45); }
.btn.main { background: linear-gradient(180deg, #1f7be8, #1456b8); border-color: #6fd6ff; box-shadow: 0 0 16px rgba(53, 200, 255, .4); }
.btn.ghost { border-color: var(--edge-dim); color: var(--mist); background: none; }
.btn.ghost:hover { color: var(--ice); }
.btn.danger { border-color: var(--alert); color: var(--alert); background: none; }
.btn.danger:hover { background: rgba(255, 90, 110, .14); box-shadow: 0 0 12px rgba(255, 90, 110, .4); }
.btn.sm { padding: 4px 10px; font-size: 13px; }

/* ---------- thẻ quest ---------- */
.cards { display: grid; gap: 14px; }
.card { padding: 16px 18px; display: grid; grid-template-columns: 1fr auto; gap: 8px 18px; cursor: pointer; }
.card:hover { border-color: var(--edge); box-shadow: 0 0 26px rgba(53, 200, 255, .22), inset 0 0 26px rgba(53, 200, 255, .08); }
.card.overdue { border-color: rgba(255, 90, 110, .6); }
.card.overdue::before, .card.overdue::after { border-color: var(--alert); filter: drop-shadow(0 0 4px var(--alert)); }
.card.dim { opacity: .55; cursor: default; }
.card h3 { font-size: 19px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: 12.5px; padding: 1px 9px; border: 1px solid var(--edge-dim); border-radius: 2px; color: var(--mist); }
.chip.warn { color: var(--alert); border-color: var(--alert); }
.chip.hot { color: var(--edge); border-color: var(--edge); }
.chip.ok { color: var(--ok); border-color: rgba(90, 240, 180, .5); }
.reward { text-align: right; font: 600 15px var(--display); line-height: 1.7; }
.reward .g { color: var(--gold); }
.reward .s { color: var(--ok); font-weight: 400; font-size: 13px; }
.card-actions { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; }

.empty { padding: 34px; text-align: center; color: var(--mist); }
.empty h2 { margin-bottom: 6px; color: var(--ice); }

/* ---------- chỉ số ---------- */
.groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px; }
.group { padding: 16px 18px 14px; }
.group h2 { margin-bottom: 10px; color: var(--edge); }
.stat { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 7px 0; border-top: 1px solid rgba(53, 200, 255, .1); }
.stat .nm { display: flex; gap: 8px; align-items: baseline; }
.stat .nm b { font: 600 15px var(--display); color: var(--ice); }
.stat .lvl { color: var(--edge); font: 13px var(--display); }
.stat .val { color: var(--mist); font-size: 13px; text-align: right; }
.bar { grid-column: 1 / -1; height: 5px; background: rgba(53, 200, 255, .12); }
.bar i { display: block; height: 100%; background: var(--edge); box-shadow: 0 0 8px var(--edge); }
.idle { font-size: 12px; color: var(--mist); grid-column: 1 / -1; }
.idle.warn { color: var(--alert); }
.addrow { display: flex; gap: 8px; margin-top: 10px; }

/* ---------- form ---------- */
input[type=text], input[type=password], input[type=number], input[type=date], select {
  background: rgba(2, 10, 26, .88); color: var(--ice); border: 1px solid var(--edge-dim); border-radius: 3px; padding: 7px 10px; min-width: 0; color-scheme: dark;
}
input[type=password]::-ms-reveal, input[type=password]::-ms-clear { display: none !important; }
input:focus, select:focus { border-color: var(--edge); }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--mist); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.form > * + * { margin-top: 14px; }
.srow, .arow { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.srow select { flex: 1; } .srow input { width: 84px; }
.arow select { width: 130px; } .arow .a-target { flex: 1; } .arow .a-args { width: 150px; }
.err { color: var(--alert); font-size: 14px; }
.hint { color: var(--mist); font-size: 13px; }

.switch { position: relative; width: 44px; height: 24px; flex: none; }
.switch input { opacity: 0; position: absolute; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border: 1px solid var(--edge-dim); border-radius: 12px; background: rgba(2, 10, 26, .8); transition: .2s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--mist); transition: .2s; }
.switch input:checked + span { border-color: var(--edge); box-shadow: 0 0 10px rgba(53, 200, 255, .5); }
.switch input:checked + span::after { transform: translateX(20px); background: var(--edge); }
.switch input:focus-visible + span { outline: 2px solid var(--edge); outline-offset: 2px; }
.setting { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 12px 0; border-top: 1px solid rgba(53, 200, 255, .1); }
.setting:first-of-type { border-top: 0; }
.setting p { margin: 0; color: var(--mist); font-size: 13px; }
.vrow { display: grid; grid-template-columns: 1fr 1.2fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid rgba(53, 200, 255, .1); }
.vrow .fn { color: var(--mist); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vrow .bt { display: flex; gap: 6px; }

/* ---------- modal ---------- */
.modal { position: fixed; inset: 0; z-index: 20; background: rgba(2, 6, 16, .78); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 24px; }
.modal-box { width: min(680px, 100%); max-height: 100%; overflow-y: auto; padding: 24px 26px; animation: pop .22s ease-out; }
.modal-box.wide { width: min(760px, 100%); }
@keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-box h1 { margin-bottom: 4px; }
.modal-foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
.acts { list-style: none; margin: 10px 0 0; padding: 0; }
.acts li { padding: 6px 0; border-top: 1px solid rgba(53, 200, 255, .1); font-size: 14px; display: flex; gap: 10px; }
.acts .k { color: var(--edge); min-width: 74px; font-family: var(--display); }
.acts .t { overflow-wrap: anywhere; }
.acts .bad { color: var(--alert); }

.timer { font: 700 84px/1.1 var(--display); text-align: center; color: var(--edge); text-shadow: 0 0 28px rgba(53, 200, 255, .75); margin: 16px 0 4px; font-variant-numeric: tabular-nums; }
.timer.over { color: var(--gold); text-shadow: 0 0 28px rgba(255, 211, 107, .6); }
.timer-note { text-align: center; color: var(--mist); min-height: 1.5em; }

.reward-box { text-align: center; }
.reward-box .big { font: 700 54px/1.1 var(--display); color: var(--gold); text-shadow: 0 0 22px rgba(255, 211, 107, .5); margin: 8px 0; }
.reward-box .lvup { font: 700 22px var(--display); color: var(--edge); text-shadow: 0 0 16px var(--edge); margin: 10px 0; }
.gains { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 10px; }

/* ---------- giai đoạn 3: cảnh báo, hiệu ứng ---------- */
.banner { padding: 10px 16px; margin-top: 14px; color: var(--mist); }
.banner.ok { color: var(--ok); border-color: rgba(90, 240, 180, .5); }
.alertbox { padding: 16px 20px; border-color: var(--alert); }
.alertbox::before, .alertbox::after { border-color: var(--alert); filter: drop-shadow(0 0 4px var(--alert)); }
.alertbox h2 { color: var(--alert); text-shadow: 0 0 12px var(--alert); }
.pen { padding: 12px 0; border-top: 1px solid rgba(255, 90, 110, .25); margin-top: 10px; }
.nav .badge.red { background: var(--alert); color: #fff; }
#fx { position: fixed; inset: 0; z-index: 60; pointer-events: none; display: flex; align-items: center; justify-content: center; overflow: hidden; }
#fx .flash { position: absolute; inset: 0; background: radial-gradient(circle, var(--fc), transparent 62%); opacity: 0; animation: fxflash 1.3s ease-out forwards; }
#fx .ring { position: absolute; width: 90px; height: 90px; border: 3px solid var(--fc); border-radius: 50%; box-shadow: 0 0 30px var(--fc), inset 0 0 20px var(--fc); opacity: 0; animation: fxring 1.7s ease-out forwards; }
#fx .ring:nth-of-type(3) { animation-delay: .25s; }
#fx .ring:nth-of-type(4) { animation-delay: .5s; }
#fx .spark { position: absolute; bottom: -10px; width: 4px; height: 4px; background: var(--fc); box-shadow: 0 0 10px var(--fc); opacity: .9; animation: fxrise 2s ease-out forwards; }
#fx .txt { position: relative; font: 700 64px var(--display); color: #fff; text-shadow: 0 0 26px var(--fc), 0 0 60px var(--fc); animation: fxtxt 2.4s ease-out forwards; text-align: center; }
@keyframes fxflash { 0% { opacity: 0; } 20% { opacity: .55; } 100% { opacity: 0; } }
@keyframes fxring { 0% { transform: scale(.2); opacity: .9; } 100% { transform: scale(16); opacity: 0; } }
@keyframes fxrise { to { transform: translateY(-110vh); opacity: 0; } }
@keyframes fxtxt { 0% { transform: scale(.6); opacity: 0; } 15% { transform: scale(1.1); opacity: 1; } 80% { opacity: 1; } 100% { transform: scale(1.2); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #fx { display: none; } }

/* ---------- giai đoạn 4: khung giờ, lịch tuần, mục tiêu ---------- */
.chk { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.chk input { width: 17px; height: 17px; accent-color: var(--edge); }
.winlist { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 6px; }
.wrowx { display: grid; grid-template-columns: 1.4fr 110px 110px auto; gap: 10px; align-items: end; padding: 10px 0; border-top: 1px solid rgba(53, 200, 255, .1); }
.wrowx:first-child { border-top: 0; }
.wrowx .bt { display: flex; gap: 6px; }
.cal { display: grid; grid-template-columns: 190px 1fr; gap: 14px; margin-top: 16px; align-items: start; }
.calpool { padding: 12px; min-height: 160px; }
.calpool h3 { margin-bottom: 8px; font-size: 16px; }
.calgrid { display: grid; grid-template-columns: repeat(7, minmax(112px, 1fr)); gap: 10px; overflow-x: auto; }
.calday { padding: 8px; min-height: 260px; display: flex; flex-direction: column; gap: 6px; }
.calday header { display: flex; align-items: center; justify-content: space-between; font-family: var(--display); }
.calday header span { color: var(--mist); font-size: 13px; margin-left: 6px; }
.calday.today { border-color: var(--edge); box-shadow: 0 0 22px rgba(53, 200, 255, .3); }
.calday.past { opacity: .7; }
.calday.over, .calpool.over { box-shadow: 0 0 0 2px var(--gold), 0 0 22px rgba(255, 211, 107, .4); }
.calday .plus { padding: 0 8px; line-height: 20px; }
.blk { border: 1px solid var(--edge-dim); background: rgba(53, 200, 255, .1); padding: 6px 8px; font-size: 13.5px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; margin-bottom: 6px; }
.blk[draggable=true] { cursor: grab; }
.blk:hover { border-color: var(--edge); }
.blk small { color: var(--mist); font-size: 12px; }
.blk.due { border-style: dashed; background: none; }
.blk.done { cursor: default; color: var(--ok); border-color: rgba(90, 240, 180, .4); background: rgba(90, 240, 180, .07); }
.blk.missed { cursor: default; color: var(--alert); border-color: rgba(255, 90, 110, .5); background: rgba(255, 90, 110, .08); }
.blk .bt { display: none; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.blk:hover .bt, .blk:focus-within .bt { display: flex; }
.blk .bt button { background: none; border: 1px solid var(--edge-dim); border-radius: 2px; padding: 0 6px; font-size: 12px; cursor: pointer; color: var(--mist); }
.blk .bt button:hover { color: var(--ice); border-color: var(--edge); }
.subs { list-style: none; margin: 10px 0 0; padding: 0; }
.subs li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid rgba(53, 200, 255, .1); }
.subs .strike { text-decoration: line-through; color: var(--mist); }
.goal .bar { margin: 10px 0 2px; height: 8px; grid-column: auto; }
.subrow { border: 1px solid var(--edge-dim); padding: 8px 10px; margin-top: 8px; }
.subrow .top { display: flex; gap: 8px; align-items: center; }
.subrow .top .sg-title { flex: 1; }
.subrow .top .sg-pts { width: 90px; }
@media (max-width: 1100px) { .cal { grid-template-columns: 1fr; } }

/* ---------- trợ lý: giọng nói, bản nháp ---------- */
.vrow2 { display: grid; grid-template-columns: 130px 1fr 100px 96px; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid rgba(53, 200, 255, .1); }
.vrow2:first-child { border-top: 0; }
.partrow { display: grid; grid-template-columns: auto 1.2fr 1.5fr auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid rgba(53, 200, 255, .1); }
.partrow:first-of-type { border-top: 0; }
.partrow .pmeta { color: var(--mist); font-size: 13px; }
@media (max-width: 860px) { .partrow { grid-template-columns: auto 1fr; } }

/* ---------- nâng cấp: Pomodoro, Mini HUD, Thống kê, Bộ lọc Quest, Dung lượng Lịch tuần ---------- */
.pomo-box { margin: 12px 0; padding: 12px 16px; border: 1px solid var(--edge-dim); background: rgba(8, 26, 53, .65); border-radius: 4px; text-align: center; }
.pomo-phase { display: inline-block; padding: 2px 12px; border-radius: 12px; font: 600 14px var(--display); margin-bottom: 6px; }
.pomo-phase.work { background: rgba(53, 200, 255, .18); color: var(--edge); border: 1px solid var(--edge); }
.pomo-phase.brk { background: rgba(90, 240, 180, .18); color: var(--ok); border: 1px solid var(--ok); }
.pomo-sub { font-size: 13px; color: var(--mist); margin-top: 4px; }
.pomo-bar { height: 6px; background: rgba(53, 200, 255, .12); border-radius: 3px; overflow: hidden; margin: 8px 0; }
.pomo-bar i { display: block; height: 100%; background: var(--edge); transition: width .25s linear; }
.pomo-bar.brk i { background: var(--ok); }

body.mini-hud #app, body.mini-hud #toasts, body.mini-hud #boot { display: none !important; }
body.mini-hud #modal { padding: 0; background: var(--abyss); }
body.mini-hud .modal-box { width: 100%; height: 100%; max-height: 100%; padding: 10px 14px; border: 1px solid var(--edge); display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
body.mini-hud .timer { font-size: 46px; margin: 2px 0; }

.filter-bar { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 10px; padding: 12px 16px; margin-top: 14px; }
@media (max-width: 860px) { .filter-bar { grid-template-columns: 1fr 1fr; } }

.calcap { font-size: 11.5px; color: var(--mist); margin: 2px 0 4px; }
.calcap.over { color: var(--alert); font-weight: 600; }
.calcap-bar { height: 4px; background: rgba(53, 200, 255, .12); margin-top: 3px; border-radius: 2px; overflow: hidden; }
.calcap-bar i { display: block; height: 100%; background: var(--edge); }
.calcap-bar.warn i { background: var(--gold); }
.calcap-bar.over i { background: var(--alert); }

.stat-grid4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-top: 16px; }
.stat-card { padding: 14px 18px; }
.stat-card .big { font: 700 32px/1.1 var(--display); color: var(--edge); margin: 4px 0; }
.stat-card .big.gold { color: var(--gold); }
.chart-grid { display: grid; grid-template-columns: 340px 1fr; gap: 18px; margin-top: 18px; align-items: stretch; }
@media (max-width: 960px) { .chart-grid { grid-template-columns: 1fr; } }
.bars14 { display: grid; grid-template-columns: repeat(14, 1fr); gap: 6px; align-items: end; height: 190px; padding: 18px 8px 6px; border-bottom: 1px solid var(--edge-dim); }
.bcol { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }

}

<body>

<script>

let calWeek = null;         // thứ Hai của tuần đang xem trên lịch
let calData = null;
let dragId = null;
const audioCache = {};
const KIND_LABEL = { url: 'Trang web', folder: 'Thư mục', app: 'Chương trình', file: 'File' };
const KIND_ITEM = { real: 'Đời thực', app: 'Trong app' };
const TIER_COLORS = ['#8fa9c4', '#35c8ff', '#b27bff', '#ffd36b', '#ff6b9a', '#ff5a3c'];
const tierColor = (idx) => TIER_COLORS[Math.min(idx, TIER_COLORS.length - 1)];
const SLOT_LABEL = { any: 'Mọi lúc', morning: 'Buổi sáng', afternoon: 'Buổi chiều', evening: 'Buổi tối' };

const $ = (s) => document.querySelector(s);
/* ================= CẦU NỐI ĐA NĂNG 3 TẦNG: PC (pywebview) <-> MẠNG LAN HTTP (/api/) <-> ĐÁM MÂY ĐỘC LẬP (GitHub Pages / APK) ================= */

function speakBrowserViTts(text) {
  return new Promise((resolve) => {
    try {
      if (!("speechSynthesis" in window) || !text) return resolve(false);
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(text).replace(/[*#_`~]/g, ""));
      u.lang = "vi-VN";
      u.rate = 1.05;
      const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
      const viVoice = voices.find((v) => (v.lang || "").toLowerCase().includes("vi"));
      if (viVoice) u.voice = viVoice;
      const timer = setTimeout(() => resolve(true), 25000);
      u.onend = () => { clearTimeout(timer); resolve(true); };
      u.onerror = () => { clearTimeout(timer); resolve(false); };
      window.speechSynthesis.speak(u);
    } catch (e) {
      resolve(false);
    }
  });
}

function _recomputeStandalonePriorities(st) {
  const now = new Date();
  const iso = now.toISOString().slice(0, 10);
  const nowMinVal = now.getHours() * 60 + now.getMinutes();
  st.now = String(now.getHours()).padStart(2, "0") + ":" + String(now.getMinutes()).padStart(2, "0");
  st.date = iso;
  const parseHmLocal = (s) => {
    if (!s || !/^\d{1,2}:\d{2}$/.test(s)) return null;
    const [h, m] = s.split(":").map(Number);
    return h * 60 + m;
  };
  const curWin = (st.windows || []).find((w) => {
    const a = parseHmLocal(w.start) ?? 0, b = parseHmLocal(w.end) ?? 1440;
    return nowMinVal >= a && nowMinVal <= b;
  }) || (st.windows && st.windows[0]) || null;
  st.window = curWin;

  const items = [];
  (st.quests || []).forEach((q) => {
    if (q.is_penalty || q.done_today) return;
    const imp = +(q.importance || 2);
    const est = +(q.estimate || q.estimate_min || q.duration_min || 25);
    q.estimate = est;
    const dlDate = q.deadline || q.scheduled_date || iso;
    const daysLeft = Math.round((new Date(dlDate + "T00:00:00") - new Date(iso + "T00:00:00")) / 86400000);
    const dlMin = parseHmLocal(q.deadline_time) ?? 1320;
    q.effective_deadline_min = dlMin;
    const isDueTodayHard = daysLeft <= 0 && Boolean(q.deadline || q.deadline_time || q.deadline_window);
    const pulled = daysLeft === 1 && imp >= 4 && est >= 45 && dlMin <= 750;
    q.pulled_to_tonight = pulled;
    let urg = 3;
    if (daysLeft < 0 || (isDueTodayHard && nowMinVal >= dlMin)) urg = 0;
    else if (isDueTodayHard) urg = 1;
    else if (pulled) urg = 2;
    q.urgency_tier = urg;
    q.abs_deadline_min = Math.max(0, daysLeft) * 1440 + dlMin + ((isDueTodayHard || pulled || q.deadline) ? 0 : 360);
    q.priority_score = imp * 35 + est * 0.5 + (urg === 1 ? 180 : (urg === 2 ? 110 : 0));
    const reasons = [];
    if (urg === 1) reasons.push(`⏰ Ưu tiên #1 về Thời gian: Hạn chót trước ${q.deadline_time || "22:00"} hôm nay`);
    else if (pulled) reasons.push(`🧠 Quyết định Hệ thống: Đẩy lên ưu tiên Tối nay (Quan trọng ${imp}/5 • ${est} phút, tránh quá tải Sáng mai)`);
    else reasons.push(`Quan trọng ${imp}/5 • Thời lượng ${est} phút`);
    items.push({
      id: q.id, score: q.priority_score, reasons, est, importance: imp,
      phase: "now", urgency_tier: urg, abs_deadline_min: q.abs_deadline_min,
      effective_deadline_min: dlMin, pulled_to_tonight: pulled, critical: imp >= 4 || urg <= 2
    });
  });
  items.sort((a, b) => a.urgency_tier - b.urgency_tier || a.abs_deadline_min - b.abs_deadline_min || b.importance - a.importance || b.est - a.est);
  st.plan = Object.assign(st.plan || {}, { items });
  st.suggestions = items.map((x) => x.id);
  st.accepted = (st.quests || []).filter((q) => !q.is_penalty && !q.done_today && (q.accepted || q.mandatory || q.pulled_to_tonight)).map((q) => q.id);
  st.cloud_sync = _loadLocalCloudCfg();
  return st;
}

function _getStandaloneState() {
  try {
    const raw = localStorage.getItem(_LS_STATE_KEY);
    if (raw) return _recomputeStandalonePriorities(JSON.parse(raw));
  } catch (e) {}
  const def = _recomputeStandalonePriorities(_defaultStandaloneState());
  try { localStorage.setItem(_LS_STATE_KEY, JSON.stringify(def)); } catch (e) {}
  return def;
}

function _saveStandaloneState(st, pushCloud = true) {
  _recomputeStandalonePriorities(st);
  try { localStorage.setItem(_LS_STATE_KEY, JSON.stringify(st)); } catch (e) {}
  if (pushCloud) _standaloneCloudPush(st);
}

async function _standaloneCloudPush(st) {
  const cfg = _loadLocalCloudCfg();
  if (!cfg.token || !cfg.gist_id) return { ok: false, error: "Chưa cấu hình GitHub Gist." };
  try {
    // Xây dựng cả parts chuẩn để khi mở PC, PC tự nạp vào SQLite system.db!
    const winById = {};
    (st.windows || []).forEach((w) => { winById[w.id] = w.name; });
    const bundle = {
      bundle: "system_quest_parts",
      version: "20.0",
      exported_at: new Date().toISOString().slice(0, 19),
      source: "mobile",
      state_snapshot: st,
      parts: {
        stats: {
          part: "stats",
          xp: st.player ? st.player.xp : 0,
          points: st.player ? st.player.points : 0,
          unlocked_ranks: (st.player && st.player.unlocked_ranks) || [],
          groups: (st.groups || []).map((g, gi) => ({
            name: g.name, sort: gi,
            stats: (g.stats || []).map((s, si) => ({ name: s.name, value: s.value, sort: si + 1 }))
          }))
        },
        quests: {
          part: "quests",
          windows: (st.windows || []).map((w) => {
            const [sh, sm] = (w.start || "07:00").split(":").map(Number);
            const [eh, em] = (w.end || "11:30").split(":").map(Number);
            return { name: w.name, start_min: sh * 60 + sm, end_min: eh * 60 + em };
          }),
          quests: (st.quests || []).map((q) => ({
            title: q.title, difficulty: q.importance || 2, importance: q.importance || 2,
            estimate_min: q.estimate || q.duration_min || 25, duration_min: q.duration_min || q.estimate || 25,
            timer_mode: q.timer_mode || "countdown", xp: q.xp || 20, points: q.points || 10,
            repeat_min: q.repeat_min || null, repeat_max: q.repeat_max || null,
            is_penalty: q.is_penalty ? 1 : 0, deadline: q.deadline || null,
            deadline_time: q.deadline_time || null, deadline_window: q.deadline_window || null,
            scheduled_date: q.scheduled_date || null,
            window_names: (q.window_ids || []).map((wid) => winById[wid]).filter(Boolean),
            stats: (q.stats || []).map((s) => ({ group_name: "Trí tuệ & Học thuật", stat_name: s.name, amount: s.amount || 1 }))
          })),
          log: ((st.analytics && st.analytics.recent_logs) || [])
        }
      }
    };
    const res = await fetch("https://api.github.com/gists/" + cfg.gist_id, {
      method: "PATCH",
      headers: {
        "Authorization": "Bearer " + cfg.token,
        "Accept": "application/vnd.github+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        files: { "system_quest_cloud_sync.json": { content: JSON.stringify(bundle) } }
      })
    });
    if (!res.ok) return { ok: false, error: "GitHub trả về mã " + res.status };
    cfg.last_sync_at = bundle.exported_at;
    cfg.last_status = "Đã đồng bộ lên Đám mây lúc " + new Date().toTimeString().slice(0, 8);
    _saveLocalCloudCfg(cfg);
    return { ok: true, action: "pushed", gist_id: cfg.gist_id, message: "Đã đồng bộ dữ liệu từ Điện thoại lên Đám mây!" };
  } catch (e) {
    return { ok: false, error: String(e) };
  }
}

async function _standaloneCloudPull() {
  const cfg = _loadLocalCloudCfg();
  if (!cfg.token || !cfg.gist_id) return { ok: false, error: "Chưa cấu hình GitHub Token & Gist ID." };
  try {
    const res = await fetch("https://api.github.com/gists/" + cfg.gist_id, {
      headers: { "Authorization": "Bearer " + cfg.token, "Accept": "application/vnd.github+json" }
    });
    if (!res.ok) return { ok: false, error: "Không tải được Gist (Mã " + res.status + ")" };
    const gobj = await res.json();
    const filesMap = gobj.files || {};
    const fEntry = filesMap["system_quest_cloud_sync.json"] || Object.values(filesMap)[0];
    if (!fEntry || !fEntry.content) return { ok: false, error: "Gist trống." };
    const remote = JSON.parse(fEntry.content);
    if (remote.state_snapshot) {
      cfg.last_sync_at = remote.exported_at || new Date().toISOString().slice(0, 19);
      cfg.last_status = "Đã nhận đồng bộ lúc " + new Date().toTimeString().slice(0, 8);
      _saveLocalCloudCfg(cfg);
      _saveStandaloneState(remote.state_snapshot, false);
      return { ok: true, action: "pulled", gist_id: cfg.gist_id, message: "Đã đồng bộ dữ liệu mới nhất về Điện thoại!" };
    }
    return { ok: false, error: "Chưa có bản chụp trạng thái trong Gist." };
  } catch (e) {
    return { ok: false, error: String(e) };
  }
}

const STANDALONE_API = new Proxy({}, {
  get(_, method) {
    return async (...args) => {
      const st = _getStandaloneState();
      if (method === "get_state") return st;
      if (method === "get_mobile_sync_info") {
        return { ok: true, port: 8765, lan_urls: [window.location.origin + window.location.pathname], cloud: _loadLocalCloudCfg() };
      }
      if (method === "configure_cloud_sync") {
        const [token, gistId] = args;
        const cleanTok = String(token || "").trim();
        let cleanGist = String(gistId || "").trim();
        if (!cleanTok) { _saveLocalCloudCfg({}); return { ok: true, enabled: false, message: "Đã tắt đồng bộ đám mây." }; }
        const headers = { "Authorization": "Bearer " + cleanTok, "Accept": "application/vnd.github+json", "Content-Type": "application/json" };
        if (!cleanGist) {
          const rList = await fetch("https://api.github.com/gists?per_page=30", { headers });
          if (rList.ok) {
            const list = await rList.json();
            const found = (list || []).find((g) => g.files && g.files["system_quest_cloud_sync.json"]);
            if (found) cleanGist = found.id;
          }
        }
        if (!cleanGist) {
          const rCreate = await fetch("https://api.github.com/gists", {
            method: "POST", headers,
            body: JSON.stringify({ description: "SYSTEM Cloud Sync", public: false, files: { "system_quest_cloud_sync.json": { content: JSON.stringify({ state_snapshot: st }) } } })
          });
          if (!rCreate.ok) return { ok: false, error: "Token không hợp lệ hoặc thiếu quyền gist." };
          const cr = await rCreate.json();
          cleanGist = cr.id;
        }
        _saveLocalCloudCfg({ enabled: true, has_token: true, token: cleanTok, gist_id: cleanGist, last_status: "Đã kết nối" });
        await _standaloneCloudPull();
        return { ok: true, enabled: true, gist_id: cleanGist, message: "Đã kết nối đám mây GitHub Gist thành công!" };
      }
      if (method === "cloud_sync_now") {
        const dir = args[0] || "auto";
        if (dir === "push") return await _standaloneCloudPush(st);
        const pullRes = await _standaloneCloudPull();
        if (pullRes.ok) return pullRes;
        return await _standaloneCloudPush(st);
      }
      if (method === "complete_quest") {
        const [qid, sec, qual] = args;
        const q = (st.quests || []).find((x) => x.id === +qid);
        if (!q) return { ok: false, error: "Không tìm thấy quest." };
        q.done_today = true;
        q.status = "done";
        const mult = qual === "great" ? 1 : (qual === "good" ? 0.8 : (qual === "medium" ? 0.55 : 0.3));
        const xpGain = Math.round((q.xp || 20) * mult);
        const ptGain = Math.round((q.points || 10) * mult);
        st.player.xp = (st.player.xp || 0) + xpGain;
        st.player.points = (st.player.points || 0) + ptGain;
        _saveStandaloneState(st, true);
        return { ok: true, title: q.title, xp: xpGain, points: ptGain, quality: qual || "good", quality_label: "Hoàn thành", gains: q.stats || [], restored: [] };
      }
      if (method === "save_quest") {
        const data = args[0] || {};
        if (!data.title) return { ok: false, error: "Quest cần có tên." };
        let q = data.id ? (st.quests || []).find((x) => x.id === +data.id) : null;
        if (!q) {
          const nextId = Math.max(0, ...(st.quests || []).map((x) => x.id)) + 1;
          q = { id: nextId, stats: [], actions: [], window_ids: [3], window_names: ["Tối"] };
          st.quests.push(q);
        }
        Object.assign(q, {
          title: data.title, importance: +(data.importance || 3),
          estimate: +(data.estimate_min || data.duration_min || 30),
          duration_min: +(data.duration_min || data.estimate_min || 30),
          timer_mode: data.timer_mode || "countdown",
          xp: +(data.xp || (10 * (data.importance || 3))),
          points: +(data.points || (5 * (data.importance || 3))),
          deadline: data.deadline || null, deadline_time: data.deadline_time || null, deadline_window: data.deadline_window || null,
          scheduled_date: (data.deadline && data.scheduled_date && data.scheduled_date > data.deadline) ? data.deadline : (data.scheduled_date || null),
          done_today: false, status: "due"
        });
        _saveStandaloneState(st, true);

const HTTP_OR_STANDALONE_PROXY = new Proxy({}, {
  get(_, method) {
    return async (...args) => {
      if (_backendMode === "standalone") {
        return await STANDALONE_API[method](...args);
      }
      try {
        const ctrl = new AbortController();
        const tId = setTimeout(() => ctrl.abort(), 4500);
        const res = await fetch("/api/" + method, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ args }),
          signal: ctrl.signal
        });
        clearTimeout(tId);
        if (res.ok) {
          _backendMode = "http";
          return await res.json();
        }
      } catch (e) {}
      _backendMode = "standalone";
      return await STANDALONE_API[method](...args);
    };
  }
});

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [880, 1175, 1568].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, ctx.currentTime + i * 0.16);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + i * 0.16 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * 0.16 + 0.15);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + i * 0.16); o.stop(ctx.currentTime + i * 0.16 + 0.16);
    });
  } catch (e) { /* không có âm thanh thì bỏ qua */ }
}

const AUDIO_SEQ_DELAY_MS = 1000; // Khoảng nghỉ bắt buộc 1.0 giây giữa mọi lần phát âm thanh / giọng nói
let lastAudioEndedAt = 0;
let currentMasterAudio = null;

function playWelcomeSound() {
  if (!state || isAppLocked()) return;

    playVoice('app_open');
  } else if (state.settings.voice || state.settings.notifications) {

  }

function enqueueMasterAudio(item) {
  return new Promise((resolve) => {
    voiceQueue.push(Object.assign({}, item, { resolve }));
    pumpVoice();
  });
}

function playVoice(ev) {
  if (!state || !state.settings.voice || isAppLocked()) return Promise.resolve();
  const use = [ev, ...(VOICE_FALLBACK[ev] || [])].find(hasVoice);
  if (!use) return Promise.resolve();
  // Không lặp cùng một thông báo trong 1.2 giây, không xếp quá 6 sự kiện cố định
  const eventCount = voiceQueue.filter((x) => x.kind === 'event').length;
  if (
    Date.now() - (lastVoice[use] || 0) < 1200 ||
    nowPlaying === use ||
    voiceQueue.some((x) => x.kind === 'event' && x.ev === use) ||
    eventCount >= 6
  ) {
    return Promise.resolve();
  }
  lastVoice[use] = Date.now();
  return enqueueMasterAudio({
    kind: 'event',
    ev: use,
    label: '🔊 Đang phát thông báo hệ thống...',
    token: null,
  });
}

async function pumpVoice() {
  if (voiceBusy) return;
  voiceBusy = true;
  try {
    while (voiceQueue.length > 0) {
      const item = voiceQueue.shift();
      if (!item) continue;
      if (item.token !== null && item.token !== undefined && item.token !== ttsStreamToken) {
        if (item.resolve) item.resolve();
        continue;
      }
      let url = null;
      let evName = item.ev || '';
      let label = item.label || 'Trợ lý đang nói...';
      try {
        if (item.kind === 'event') {
          url = await api().get_audio(item.ev);
        } else if (item.kind === 'tts_promise') {
          const r = await item.promise;
          if (r && r.ok && r.audio_url) {
            url = r.audio_url;
          } else if (r && !r.ok && !item.silentToast && r.error) {
            toast(r.error, true);
          }
        } else if (item.kind === 'data_url') {
          url = item.dataUrl;
        }
      } catch (e) {
        url = null;
      }

      if (!url || (item.token !== null && item.token !== undefined && item.token !== ttsStreamToken)) {
        if (item.resolve) item.resolve();
        continue;
      }

      // Đảm bảo khoảng nghỉ tuần tự đúng 1.0 giây (1000ms) kể từ khi câu/âm thanh trước kết thúc!
      if (lastAudioEndedAt > 0) {
        const elapsed = Date.now() - lastAudioEndedAt;
        const waitMs = AUDIO_SEQ_DELAY_MS - elapsed;
        if (waitMs > 0) {
          showTtsStopBar(true, `⏳ Nghỉ 1s chuyển câu... (Còn ${voiceQueue.length + 1} lượt nói)`);
          await new Promise((r) => setTimeout(r, waitMs));
        }
      }

      if (item.token !== null && item.token !== undefined && item.token !== ttsStreamToken) {
        if (item.resolve) item.resolve();
        continue;
      }

      nowPlaying = evName || 'tts';
      const qLeft = voiceQueue.length;
      const barText = qLeft > 0 ? `${label} (Còn ${qLeft} câu chờ)` : label;
      showTtsStopBar(true, barText);
      await playUrl(url, evName);
      nowPlaying = '';
      lastAudioEndedAt = Date.now();
      if (evName) lastVoice[evName] = lastAudioEndedAt;
      if (item.resolve) item.resolve();
    }
  } finally {
    voiceBusy = false;
    nowPlaying = '';
    if (!voiceQueue.length && !currentMasterAudio) {
      showTtsStopBar(false);
    }
  }
}

function playUrl(url, ev) {
  return new Promise((resolve) => {
    try {
      if (currentMasterAudio) {
        try { currentMasterAudio.pause(); currentMasterAudio.src = ''; } catch (e) {}
        currentMasterAudio = null;
      }
      const a = new Audio(url);
      currentMasterAudio = a;
      currentTtsAudio = a;
      const t = setTimeout(() => done(), 60000);
      const done = () => {
        clearTimeout(t);
        if (currentMasterAudio === a) currentMasterAudio = null;
        if (currentTtsAudio === a) currentTtsAudio = null;
        try { a.pause(); a.src = ''; } catch (e) {}
        resolve();
      };
      a.onended = done;
      a.onerror = done;
      a.play().catch(() => {
        if (ev === 'app_open') pendingVoice = ev;
        done();
      });
    } catch (e) {
      resolve();
    }
  });
}

function captureViewState(clearIds = []) {
  const v = $('#view');
  if (!v) return null;
  const clearSet = new Set(clearIds);
  const byIdMap = {};
  v.querySelectorAll('input, textarea, select').forEach((el) => {
    if (!el.id || clearSet.has(el.id)) return;
    if (el.dataset.dirty === '1' || el === document.activeElement) {
      byIdMap[el.id] = {
        value: el.value,
        checked: el.checked,
        type: el.type,
        dirty: el.dataset.dirty || '',
      };
    }
  });
  const bwChecked = [...v.querySelectorAll('input.bw')].map((x) => ({ val: x.value, checked: x.checked, dirty: x.dataset.dirty }));
  const ae = document.activeElement;
  let focusInfo = null;
  if (ae && v.contains(ae) && ae.id && !clearSet.has(ae.id)) {
    let selStart = null, selEnd = null;
    try { selStart = ae.selectionStart; selEnd = ae.selectionEnd; } catch (e) {}
    focusInfo = { id: ae.id, selStart, selEnd };
  }
  return { key: viewStateKey(), scrollTop: v.scrollTop, byIdMap, bwChecked, focusInfo };
}

function restoreViewState(snap) {
  const v = $('#view');
  if (!v || !snap || snap.key !== viewStateKey()) return;
  Object.entries(snap.byIdMap).forEach(([id, info]) => {
    const el = document.getElementById(id);
    if (!el) return;
    if (info.type === 'checkbox' || info.type === 'radio') el.checked = info.checked;
    else el.value = info.value;
    if (info.dirty) el.dataset.dirty = info.dirty;
  });
  if (snap.bwChecked && snap.bwChecked.some((x) => x.dirty === '1')) {
    snap.bwChecked.forEach((x) => {
      const cb = v.querySelector(`input.bw[value="${x.val}"]`);
      if (cb) { cb.checked = x.checked; if (x.dirty) cb.dataset.dirty = x.dirty; }
    });
  }
  v.scrollTop = snap.scrollTop;
  if (snap.focusInfo) {
    const fel = document.getElementById(snap.focusInfo.id);
    if (fel) {
      try {
        fel.focus({ preventScroll: true });
        if (snap.focusInfo.selStart !== null && fel.setSelectionRange) {
          fel.setSelectionRange(snap.focusInfo.selStart, snap.focusInfo.selEnd);
        }
      } catch (e) {}
    }
  }
  viewDirty = Boolean(v.querySelector('[data-dirty="1"]'));
}

    if (q.timer_mode === 'stopwatch') c.push('<span class="chip">Bấm giờ</span>');
    if (q.timer_mode === 'pomodoro') c.push(`<span class="chip hot">🍅 Pomodoro ${q.duration_min}p</span>`);
    if (q.actions.length) c.push(`<span class="chip">${q.actions.length} hành động tự mở</span>`);
    return c.join('');
  }
  c.push(`<span class="chip">${q.window_names.length ? esc(q.window_names.join(', ')) : 'Mọi lúc'}</span>`);
  c.push(`<span class="chip ${q.importance >= 4 ? 'hot' : ''}">Quan trọng ${q.importance}/5</span>`);
  c.push(`<span class="chip">Ước tính ${q.estimate} phút</span>`);
  if (q.mandatory) {
    c.push(`<span class="chip warn" style="font-weight:700">${esc(q.mandatory_label || 'Bắt buộc hôm nay')}</span>`);
  } else if (q.is_overdue_now && !q.done_today) {
    c.push(`<span class="chip warn" style="font-weight:700">⚠️ Đã quá hạn ${esc(q.deadline_time || '')}</span>`);
  }
  if (q.breakthrough_rank) c.push(`<span class="chip" style="border-color:var(--gold);color:var(--gold)">⚡ Đột phá ${esc(q.breakthrough_rank)}</span>`);
  if (q.exam_info) c.push(`<span class="chip hot">📝 ${esc(q.exam_info.kind_label)} (${esc(q.exam_info.difficulty_label)}) • Còn ${q.exam_info.days_left} ngày</span>`);
  if (q.timer_mode === 'countdown') c.push(`<span class="chip">Đếm ngược ${q.duration_min} phút</span>`);
  if (q.timer_mode === 'stopwatch') c.push('<span class="chip">Bấm giờ</span>');
  if (q.timer_mode === 'pomodoro') c.push(`<span class="chip hot">🍅 Pomodoro ${q.duration_min}p (${q.pomo_work || state.settings.pomo_work}/${q.pomo_break || state.settings.pomo_break})</span>`);
  if (q.repeat_min) c.push(`<span class="chip">Lặp ngẫu nhiên ${q.repeat_min === q.repeat_max ? q.repeat_min : q.repeat_min + '-' + q.repeat_max} ngày</span>`);
  if (q.status === 'due' && q.repeat_min) c.push(`<span class="chip ${q.late_days > 0 ? 'warn' : 'hot'}">${q.late_days > 0 ? 'Đã trễ ' + q.late_days + ' ngày' : (q.last_done ? 'Đến hạn hôm nay' : 'Chưa làm lần nào')}</span>`);
  else if (q.status === 'waiting' && q.repeat_min) c.push(`<span class="chip ok">Lần tới: ${fmtDay(q.scheduled_date || q.next_due)}</span>`);
  else if (q.status === 'done') c.push(`<span class="chip ok">✓ Đã xong hôm nay${(q.done_count_today || 1) > 1 ? ' (x' + q.done_count_today + ')' : ''}</span>`);
  else if (q.pulled_to_tonight) c.push(`<span class="chip hot" style="border-color:var(--edge);color:#fff;font-weight:700">🧠 Đẩy lên ưu tiên Tối nay (Tránh quá tải Sáng mai)</span>`);
  else if (q.status === 'scheduled') c.push(`<span class="chip hot">Xếp lịch ngày ${fmtDay(q.scheduled_date)}</span>`);
  if (q.accepted && !q.done_today) c.push(`<span class="chip ${q.is_overdue_now ? 'warn' : 'hot'}">${esc(q.due_time_label || 'Đã nhận, xong trước 0h')}</span>`);
  if (q.avg_actual_min && Math.abs(q.avg_actual_min - q.estimate) >= 5) c.push(`<span class="chip" title="Trợ lý học từ lịch sử hoàn thành của bạn">Thực tế TB: ${q.avg_actual_min}p</span>`);
  if (q.deadline) {
    const isPastDl = (q.deadline < state.date || q.is_overdue_now) && !q.done_today;
    const dlExtra = q.deadline_window ? ` • Hết khung ${esc(q.deadline_window)}${q.deadline_time ? ' (' + esc(q.deadline_time) + ')' : ''}` : (q.deadline_time ? ` • Trước ${esc(q.deadline_time)}` : '');
    c.push(`<span class="chip ${isPastDl ? 'warn' : (q.goal_id || q.subgoal_id || q.deadline_time ? 'hot' : '')}">${isPastDl ? '🔥 Quá hạn chót ' : 'Hạn chót '}${fmtDayFull(q.deadline)}${dlExtra}</span>`);
  }
  else if (!q.repeat_min) c.push('<span class="chip">∞ Không hạn chót</span>');
  if (q.makeup_quest_id) c.push('<span class="chip">Có quest làm bù riêng</span>');
  if (q.actions.length) c.push(`<span class="chip">${q.actions.length} hành động tự mở</span>`);
  return c.join('');
}

function rewardFor(q) {
  if (q.is_penalty) {
    const names = q.stats.map((x) => esc(x.name)).join(', ');
    return `<div class="reward">${q.penalty ? `<span class="g">Lấy lại ${q.penalty.restore} điểm</span><br><span class="s">${esc(q.penalty.stat_name)}</span>` : `<span class="s">Làm bù điểm đã mất${names ? ': ' + names : ''}</span>`}</div>`;
  }
  const s = q.stats.map((x) => `+${x.amount} ${esc(x.name)}`).join(', ');
  const debt = q.penalty && q.penalty.debt ? `<br><span class="s" style="color:var(--gold)">Gỡ nợ: lấy lại ${q.penalty.restore} điểm</span>` : '';
  return `<div class="reward">+${q.xp} kinh nghiệm<br><span class="g">+${q.points} điểm</span>${s ? `<br><span class="s">${s}</span>` : ''}${debt}</div>`;
}

let showAllWindowQuests = false;
let lastAutoVisualQuests = [];
let lastAutoVisualTitle = '';

async function quickCompleteQuest(qid, quality = 'good') {
  const q = byId(qid);
  const estMin = q ? (q.estimate || q.duration_min || 20) : 20;
  if (active && active.id === qid) {
    stopTimer();
    exitMiniModeIfNeeded();
    active = null;
  }
  const res = await api().complete_quest(qid, estMin * 60, quality);
  if (!res.ok) return toast(res.error, true);
  playVoice(res.ranked_up ? 'rank_up' : res.leveled_up ? 'level_up' : (res.gains || []).some((g) => g.leveled_up) ? 'stat_level_up' : res.debt_settled ? 'debt_cleared' : 'quest_complete');
  const gStr = (res.gains || []).map((g) => `+${g.amount} ${g.name}`).join(', ');
  toast(`✅ Đã hoàn thành "${res.title}" (+${res.xp} XP, +${res.points} điểm${gStr ? ', ' + gStr : ''})!`);
  await refresh({ resetInputs: true });
}

async function runQuickSystemCmd(cmdText) {
  const inp = $('#autoCmdInp');
  if (inp) {
    inp.value = cmdText;
    await submitAutoCommand();
  } else {
    const r = await api().ai_chat(cmdText, true);
    if (r && r.ok) {
      lastAutoAiReply = r.reply || '';
      lastAutoAiExec = r.executed || [];
      lastAutoVisualQuests = r.visual_quests || [];
      lastAutoVisualTitle = r.visual_title || '';
      await refresh({ resetInputs: true });
    }
  }
}

function cardHtml(q, opts = {}) {
  const dim = q.status === 'done';
  const waitDim = q.status === 'waiting' && !opts.force;
  const isOverdueDl = Boolean(((q.deadline && q.deadline < state.date) || q.is_overdue_now) && !q.done_today);
  const hot = q.is_penalty || (q.penalty && q.penalty.debt) || isOverdueDl;
  const bt = Boolean(q.breakthrough_rank);
  const sttBadge = opts.stt
    ? `<span class="chip hot" style="background:rgba(53,200,255,.2);border-color:var(--edge);color:#fff;font:700 13.5px var(--display);margin-right:8px;padding:2px 9px">#${opts.stt}</span>`
    : '';
  const recBadge = (opts.stt === 1 && !dim)
    ? `<span class="chip hot" style="border-color:var(--gold);color:var(--gold);margin-left:6px;font-weight:700">🔥 Ưu tiên #1</span>`
    : '';
  const pledgeBadge = q.pledge
    ? `<span class="chip ok" style="margin-left:6px">🔥 Đã cam kết: ${esc(q.pledge.quality_label || 'Khá tốt')}</span>`
    : '';
  const hideManualBtns = isAutoUiMode() && currentView === 'today';
  const actionButtons = dim
    ? `<button class="btn sm ghost" onclick="event.stopPropagation();quickCompleteQuest(${q.id}, 'good')" title="Làm thêm 1 lần nữa (+70% thưởng)">✓ Làm lại (+70%)</button>
       <button class="btn sm" onclick="event.stopPropagation();startQuest(${q.id})">🔄 Bấm giờ</button>`
    : (hideManualBtns
      ? `<button class="btn sm ok-btn" onclick="event.stopPropagation();quickCompleteQuest(${q.id}, 'good')" title="Đánh dấu đã hoàn thành ngay (ghi nhận đủ thời gian ước tính)">✓ Đã hoàn thành</button>
         <button class="btn sm main" onclick="event.stopPropagation();startQuest(${q.id})" title="Bắt đầu bấm giờ làm nhiệm vụ">▶ Bắt đầu</button>`
      : `<button class="btn sm ok-btn" onclick="event.stopPropagation();openDirectCompleteModal(${q.id})">✓ Đã hoàn thành</button>
         <button class="btn sm main" onclick="event.stopPropagation();startQuest(${q.id})">▶ Bắt đầu làm</button>`);
  const acts = actionButtons
    + (!hideManualBtns && opts.accept && !q.accepted && !dim ? `<button class="btn sm" onclick="event.stopPropagation();twoStep(this,'Bấm lần nữa để nhận (bỏ lỡ sẽ bị trừ điểm)',()=>acceptQuest(${q.id}))">Nhận quest</button>` : '')
    + (!hideManualBtns && opts.swap && !dim ? `<button class="btn sm ghost" onclick="event.stopPropagation();swapQuest(${q.id})">Đổi khác</button>` : '');
  return `<article class="card panel ${hot ? 'overdue' : ''} ${bt ? 'bt-card' : ''} ${dim ? 'dim' : (waitDim ? 'waiting-card' : '')}" style="${waitDim ? 'opacity:.78' : ''}" tabindex="0" onclick="openQuest(${q.id})" onkeydown="if(event.key==='Enter')openQuest(${q.id})">
    <div><h3>${sttBadge}${esc(q.title)}${recBadge}${pledgeBadge}</h3><div class="chips">${chipsFor(q)}</div>${opts.item ? whyHtml(opts.item) : ''}</div>
    ${rewardFor(q)}
    <div class="card-actions" style="flex-wrap:wrap">${acts}</div>
  </article>`;
}

function whyHtml(it) {
  const head = [];
  if (it.start) head.push(`<b>Xếp ${it.start}-${it.end}</b>`);
  if (it.no_time) head.push('<span class="warn"><b>Không đủ thời gian</b></span>');
  else if (it.tight) head.push('<span class="warn"><b>Thời gian sát</b></span>');
  const rs = it.reasons.filter((r) => !/^Xếp /.test(r));
  return `<div class="why">${head.join(' ')}${head.length && rs.length ? '<br>' : ''}${rs.map(esc).join('<br>')}</div>`;
}

let swapOver = {};   // {id bị đổi: mục kế hoạch thay thế}
let swapKey = '';
function planItems() {
  if (swapKey !== winKey()) { swapOver = {}; swapKey = winKey(); }
  const seen = new Set();
  return state.plan.items.map((it) => swapOver[it.id] || it).filter((it) => {
    const q = byId(it.id);
    if (!q || q.accepted || seen.has(it.id)) return false;
    seen.add(it.id); return true;
  });
}

function autoCommandHeroHtml(compact = false) {

function tryClientKeywordNav(rawText) {
  let clean = String(rawText || '').toLowerCase().replace(/[.,!?…;:"'()\[\]\-]+/g, ' ').replace(/\s+/g, ' ').trim();
  if (!clean || clean.split(' ').length > 10) return null;

  const forbid = ['tạo ', 'thêm ', 'xóa ', 'cộng ', 'thưởng chỉ số', 'thưởng điểm', 'trừ ', 'giảm giá', 'hạ giá', 'tăng giá', 'tôi mới', 'tôi vừa', 'mới làm', 'vừa làm', 'phụ mẹ', 'giúp mẹ', 'báo bận'];
  if (forbid.some((w) => clean.includes(w))) return null;

  clean = clean.replace(/^(?:này|ê|alo|trợ lý|hệ thống|ơi|vui lòng|làm ơn|nhờ bạn|nhờ trợ lý|\s)+/, '').trim();
  clean = clean.replace(/\s+(?:cho tôi|cho mình|giúp tôi|giúp mình|xem|lên|ra|nhé|nha|đi|ngay|luôn|với|nào|ạ)+$/, '').trim();

  const mTab = clean.match(/^(?:tab|bảng|trang|màn hình)\s+(.+)$/);
  const mPref = clean.match(/^(?:hãy mở|mở giúp|mở cho tôi|mở ngay|mở|hãy cho tôi xem|cho tôi xem|cho mình xem|hãy cho xem|cho xem|xem giúp|xem|bật|vào|đi tới|đi đến|chuyển sang|chuyển qua|chuyển tới|hiển thị|quay về|quay lại|về)\s+(?:tab\s+|bảng\s+|trang\s+|màn hình\s+)?(.+)$/);

  let target = '';
  if (mTab) target = mTab[1].trim();
  else if (mPref) target = mPref[1].trim();
  else return null;

  target = target.replace(/^(?:tab|bảng|trang|màn hình)\s+/, '').trim();
  target = target.replace(/\s+(?:cho tôi|cho mình|giúp tôi|nhé|nha|đi|lên|ra)$/, '').trim();

  const rules = [
    { keys: ['lịch tuần', 'thời khóa biểu', 'lịch của tôi', 'lịch', 'lịch biểu', 'kế hoạch tuần'], nav: { view: 'calendar', label: 'Lịch tuần' } },
    { keys: ['chỉ số', 'các chỉ số', 'thuộc tính', 'chỉ số cá nhân'], nav: { view: 'stats', label: 'Bảng Chỉ số' } },
    { keys: ['túi đồ', 'kho đồ', 'hành trang', 'vật phẩm', 'túi vật phẩm'], nav: { view: 'shop', shopTab: 'bag', label: 'Túi đồ' } },
    { keys: ['quản lý phần thưởng', 'chỉnh sửa phần thưởng', 'sửa phần thưởng'], nav: { view: 'shop', shopTab: 'manage', label: 'Quản lý phần thưởng' } },
    { keys: ['phần thưởng', 'thưởng', 'cửa hàng', 'cửa hàng phần thưởng', 'shop', 'quay gacha', 'gacha', 'đổi thưởng'], nav: { view: 'shop', shopTab: 'buy', label: 'Cửa hàng Phần thưởng' } },
    { keys: ['mục tiêu', 'mục tiêu lớn', 'mục tiêu nhỏ', 'mục tiêu lớn và nhỏ', 'các mục tiêu'], nav: { view: 'quests', questTab: 'goals', label: 'Mục tiêu lớn & nhỏ' } },
    { keys: ['quest', 'nhiệm vụ', 'danh sách quest', 'danh sách nhiệm vụ', 'tất cả quest', 'tất cả nhiệm vụ', 'quản lý quest', 'quest và mục tiêu'], nav: { view: 'quests', questTab: 'quests', label: 'Danh sách Quest' } },
    { keys: ['thống kê', 'biểu đồ', 'biểu đồ thống kê', 'tổng kết tuần', 'báo cáo tuần', 'nhật ký', 'độ siêng năng', 'siêng năng', 'điểm nghe lời', 'nghe lời'], nav: { view: 'analytics', label: 'Thống kê & Tổng kết tuần' } },
    { keys: ['trợ lý', 'trợ lý ai', 'ai', 'chat ai', 'bộ nhớ', 'bộ nhớ ai'], nav: { view: 'ai', label: 'Trợ lý AI' } },
    { keys: ['cài đặt giọng nói', 'cài đặt mic', 'cài đặt âm thanh', 'giọng nói', 'mic'], nav: { view: 'settings', settingsTab: 'voice', label: 'Cài đặt Giọng nói & Mic' } },
    { keys: ['cài đặt lịch', 'lịch rảnh'], nav: { view: 'settings', settingsTab: 'schedule', label: 'Cài đặt Lịch của tôi' } },
    { keys: ['cài đặt hình phạt', 'hình phạt'], nav: { view: 'settings', settingsTab: 'punish', label: 'Cài đặt Hình phạt' } },
    { keys: ['cài đặt', 'cài đặt hệ thống', 'cài đặt chung', 'thiết lập', 'cấu hình'], nav: { view: 'settings', label: 'Cài đặt Hệ thống' } },
    { keys: ['trang chủ', 'màn hình chính', 'hôm nay', 'nhiệm vụ hôm nay', 'chính', 'home'], nav: { view: 'today', label: 'Màn hình chính' } },
  ];
  for (const r of rules) {
    if (r.keys.includes(target)) return r.nav;
  }
  return null;
}

async function submitAutoCommand() {
  if (aiBusy) return;
  const inp = $('#autoCmdInp');
  const msg = (inp && inp.value || '').trim();
  if (!msg) return toast('Hãy nhập lệnh hoặc bấm 🎤 để nói.', true);
  if (inp) inp.value = '';

  // 1. Thử nhận diện mở tab cục bộ 0ms trước (không tốn API)
  const nav = tryClientKeywordNav(msg);
  if (nav) {
    if (nav.shopTab) shopTab = nav.shopTab;
    if (nav.questTab) questTab = nav.questTab;
    if (nav.settingsTab) settingsTab = nav.settingsTab;
    lastAutoAiReply = `Đã mở ${nav.label} ngay cho bạn.`;
    lastAutoAiExec = [`Mở ${nav.label} (Thuật toán nhận diện từ 0ms)`];
    goView(nav.view);
    return;
  }

  // 2. Gửi sang Backend (local fast router xử lý giảm giá / kêu lười 0ms, hoặc Gemini AI cho câu phức tạp)
  aiBusy = true;
  const btn = $('#btnAutoSend');
  if (btn) { btn.disabled = true; btn.textContent = '⏳...'; }
  try {
    const r = await api().ai_chat(msg, true);
    aiBusy = false;
    if (!r.ok) {
      toast(r.error, true);
      return;
    }
    localSugg = null;
    lastAutoAiReply = r.reply || '';
    lastAutoAiExec = r.executed || [];
    lastAutoVisualQuests = r.visual_quests || [];
    lastAutoVisualTitle = r.visual_title || '';
    if (r.shop_tab) shopTab = r.shop_tab;
    if (r.quest_tab) questTab = r.quest_tab;
    if (r.settings_tab) settingsTab = r.settings_tab;
    if (r.open_view) {
      currentView = r.open_view;
      document.querySelectorAll('.nav').forEach((x) => x.classList.toggle('on', x.dataset.view === currentView));
    }
    await refresh({ resetInputs: true });
    if (r.start_quest_id && byId(r.start_quest_id)) {
      startQuest(r.start_quest_id);
    }
    if (state && state.settings && state.settings.tts_enabled && state.settings.tts_read_ai && r.reply) {
      speakCustomText(r.reply, true, null, false);
    }
  } finally {
    aiBusy = false;
    if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = 'Gửi ➤'; }
  }
}

function sortQuestsByTimeAndImp(list) {
  return list.slice().sort((a, b) => {
    const urgA = a.urgency_tier ?? 3;
    const urgB = b.urgency_tier ?? 3;
    if (urgA !== urgB) return urgA - urgB;
    const absA = a.abs_deadline_min ?? 999999;
    const absB = b.abs_deadline_min ?? 999999;
    if (absA !== absB) return absA - absB;
    const impA = a.importance || 1;
    const impB = b.importance || 1;
    if (impB !== impA) return impB - impA;
    const estA = a.estimate || a.duration_min || 20;
    const estB = b.estimate || b.duration_min || 20;
    if (estB !== estA) return estB - estA;
    const scA = a.priority_score || 0;
    const scB = b.priority_score || 0;
    if (scB !== scA) return scB - scA;
    return a.id - b.id;
  });
}

    : '';
  const overloadHtml = overloadProposalHtml();

  const baseSttOffset = acc.length + nowItems.length;
  const plannedBelowHtml = (laterItems.length || futurePlanned.length)
    ? `<div class="section">
        <h2>📅 Dự kiến các khung giờ tiếp theo &amp; sắp tới</h2>

          ${futurePlanned.map((q, idx) => cardHtml(q, { stt: baseSttOffset + laterItems.length + idx + 1, accept: false })).join('')}
        </div>
      </div>`
    : '';

  if (isAutoUiMode()) {
    const winTitle = state.window ? `Khung giờ ${esc(state.window.name)} (${state.window.start}–${state.window.end})` : 'Khung giờ hiện tại';
    // Gộp các nhiệm vụ ưu tiên trong khung giờ hiện tại thành 1 danh sách duy nhất có đánh số thứ tự #1, #2, #3, #4...
    const combinedWinQuests = [];
    const seenWinIds = new Set();
    acc.forEach((q) => {
      const itObj = allPlanMap[q.id] || null;
      if (itObj && itObj.phase === 'later' && !q.deadline_time && !q.pulled_to_tonight) return;
      if (!seenWinIds.has(q.id)) {

        seenWinIds.add(q.id);
        combinedWinQuests.push({ q, item: it });
      }
    });
    combinedWinQuests.sort((x, y) => {

      const estA = a.estimate || a.duration_min || 20;
      const estB = b.estimate || b.duration_min || 20;
      if (estB !== estA) return estB - estA;
      return (b.priority_score || 0) - (a.priority_score || 0);
    });
    const totalWinCount = combinedWinQuests.length;
    const visibleWinQuests = showAllWindowQuests ? combinedWinQuests : combinedWinQuests.slice(0, 4);
    const hasMoreWin = totalWinCount > 4;

    v.innerHTML = `
      ${autoCommandHeroHtml(false)}
      ${activeBuffsBannerHtml()}
      ${bannerHtml()}${examsHtml()}${debtHtml()}${penaltyHtml()}

function filterQuestsList() {
  const kw = (qFilter.text || '').trim().toLowerCase();
  let list = state.quests.filter((q) => {
    if (kw && !q.title.toLowerCase().includes(kw)) return false;
    const isGoalQ = Boolean(q.goal_id || q.subgoal_id);
    if (qFilter.type === 'normal' && (q.is_penalty || q.breakthrough_rank || isGoalQ)) return false;
    if (qFilter.type === 'goal' && !isGoalQ) return false;
    if (qFilter.type === 'repeat' && !q.repeat_min) return false;
    if (qFilter.type === 'due' && (q.is_penalty || q.status !== 'due')) return false;
    if (qFilter.type === 'penalty' && !q.is_penalty) return false;
    if (qFilter.type === 'breakthrough' && !q.breakthrough_rank) return false;
    if (qFilter.group !== 'all') {
      const gid = +qFilter.group;
      if (!q.stats.some((s) => s.group_id === gid)) return false;
    }
    return true;
  });
  if (qFilter.sort === 'imp') {
    list.sort((a, b) => (b.importance || 1) - (a.importance || 1) || (a.window_start_min ?? 1440) - (b.window_start_min ?? 1440) || a.id - b.id);
  } else if (qFilter.sort === 'due') {
    list.sort((a, b) => (a.deadline || a.next_due || '9999').localeCompare(b.deadline || b.next_due || '9999') || (b.importance || 1) - (a.importance || 1));
  } else if (qFilter.sort === 'name') {
    list.sort((a, b) => a.title.localeCompare(b.title));
  } else {
    // Mặc định: Xếp theo Thời gian (Ngày -> Khung giờ), nếu cùng khung thời gian thì ưu tiên Mức quan trọng cao lên trước
    list = sortQuestsByTimeAndImp(list);
  }
  return list;
}

function renderQuestCardsOnly() {
  const box = $('#questCardsBox');
  if (!box) return;
  const filtered = filterQuestsList();
  if (!filtered.length) {
    box.innerHTML = `<div class="panel empty"><h2>${state.quests.length ? 'Không có quest nào khớp bộ lọc' : 'Chưa có quest nào'}</h2><p>${state.quests.length ? 'Hãy thử đổi từ khóa hoặc bộ lọc phía trên.' : 'Bấm Tạo quest để bắt đầu.'}</p></div>`;
    return;
  }
  const curWinId = state.window ? state.window.id : null;
  const todayQuests = filtered.filter((q) => !q.is_penalty && !q.done_today && (q.accepted || q.status === 'due' || q.status === 'available' || q.scheduled_date === state.date))
    .sort((a, b) => {
      const aNow = (!a.window_ids.length || (curWinId && a.window_ids.includes(curWinId))) ? 0 : 1;
      const bNow = (!b.window_ids.length || (curWinId && b.window_ids.includes(curWinId))) ? 0 : 1;
      if (aNow !== bNow) return aNow - bNow;
      if ((a.window_start_min ?? 1440) !== (b.window_start_min ?? 1440)) return (a.window_start_min ?? 1440) - (b.window_start_min ?? 1440);
      if ((b.importance || 1) !== (a.importance || 1)) return (b.importance || 1) - (a.importance || 1);
      return (b.priority_score || 0) - (a.priority_score || 0);
    });
  const todaySet = new Set(todayQuests.map((q) => q.id));
  const plannedQuests = filtered.filter((q) => !todaySet.has(q.id));

  box.innerHTML = `
    ${todayQuests.length ? `<div style="margin-bottom:18px">
      <h2 style="margin:0 0 8px;color:var(--edge)">⚡ Nhiệm vụ Hôm nay (${todayQuests.length} — Xếp theo Khung giờ &amp; Độ quan trọng)</h2>
      <div class="cards">${todayQuests.map(renderQuestRowCardHtml).join('')}</div>
    </div>` : ''}
    ${plannedQuests.length ? `<div>
      <h2 style="margin:0 0 8px;color:var(--ice)">📅 Phần Dự kiến / Sắp tới &amp; Khác (${plannedQuests.length} — Xếp theo Thời gian &amp; Độ quan trọng)</h2>
      <div class="cards">${plannedQuests.map(renderQuestRowCardHtml).join('')}</div>
    </div>` : ''}
  `;
}

function moveStatDom(btn, dir) {
  const row = btn.closest('.stat');
  if (!row || !row.parentNode) return;
  const parent = row.parentNode;
  if (dir < 0 && row.previousElementSibling) {
    parent.insertBefore(row, row.previousElementSibling);
    viewDirty = true;
  } else if (dir > 0 && row.nextElementSibling) {
    parent.insertBefore(row.nextElementSibling, row);
    viewDirty = true;
  }
}

function moveGroupDom(btn, dir) {
  const sec = btn.closest('section.group');
  if (!sec || !sec.parentNode) return;
  const parent = sec.parentNode;
  if (dir < 0 && sec.previousElementSibling) {
    parent.insertBefore(sec, sec.previousElementSibling);
    viewDirty = true;
  } else if (dir > 0 && sec.nextElementSibling) {
    parent.insertBefore(sec.nextElementSibling, sec);
    viewDirty = true;
  }
}

function unlockStatsEdit() {
  statsEditMode = true;
  viewDirty = false;
  renderView({ resetInputs: true });
}

function cancelStatsEdit() {
  statsEditMode = false;
  viewDirty = false;
  renderView({ resetInputs: true });
}

async function saveStatsEdit() {
  const groups = {};
  document.querySelectorAll('#view .grp-edit-inp').forEach((el) => {
    groups[el.dataset.gid] = el.value;
  });
  const stats = {};
  document.querySelectorAll('#view .stat-edit-inp').forEach((el) => {
    stats[el.dataset.sid] = el.value;
  });
  const stat_values = {};
  document.querySelectorAll('#view .stat-val-inp').forEach((el) => {
    stat_values[el.dataset.sid] = el.value;
  });
  const group_order = [...document.querySelectorAll('#editGroupsContainer > section.group')].map((sec) => +sec.dataset.gid);
  const stat_order = {};
  document.querySelectorAll('#editGroupsContainer .stat-list-box').forEach((box) => {
    stat_order[box.dataset.gid] = [...box.querySelectorAll('.stat')].map((row) => +row.dataset.sid);
  });
  const new_stats = {};
  document.querySelectorAll('#view .new-stat-inp').forEach((el) => {
    if ((el.value || '').trim()) new_stats[el.dataset.gid] = el.value;
  });
  const new_group = ($('#newGroup') && $('#newGroup').value) || '';
  const r = await api().save_stats_batch({ groups, stats, stat_values, group_order, stat_order, new_stats, new_group });
  if (!r.ok) return toast(r.error, true);
  statsEditMode = false;
  viewDirty = false;
  toast('Đã lưu chỉ số, thứ tự sắp xếp và khóa chỉnh sửa.');
  await refresh({ resetInputs: true });
}

async function delGroup(gid) {
  const r = await api().delete_group(gid);
  if (!r.ok) return toast(r.error, true);
  toast('Đã xóa nhóm chỉ số.');
  await refresh();
}

async function delStat(sid) {
  const r = await api().delete_stat(sid);
  if (!r.ok) return toast(r.error, true);
  toast('Đã xóa chỉ số.');
  await refresh();
}

/* ----- cửa hàng ----- */
const tabBar = (tabs, cur, fn) => `<div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab ${cur === k ? 'on' : ''}" role="tab" aria-selected="${cur === k}" onclick="${fn}('${k}')">${l}</button>`).join('')}</div>`;
function setShopTab(t) { shopTab = t; viewDirty = false; lastRenderedViewKey = viewStateKey(); renderShop(); }
function setSettingsTab(t) { settingsTab = t; viewDirty = false; lastRenderedViewKey = viewStateKey(); renderSettings(); }

function effectBadgeHtml(eff, val) {
  val = val || 1;
  if (eff === 'skip_quest') return '<span class="chip ok">⏭️ Vé Skip 1 Nhiệm vụ</span>';
  if (eff === 'skip_ticket') return '<span class="chip ok">🎫 Vé Skip cả ngày</span>';
  if (eff === 'punish_immune') return `<span class="chip hot">🛡️ Miễn nhiễm phạt ≤ Cấp ${val}</span>`;
  if (eff === 'reduce_punish') return `<span class="chip ok">⚖️ Giảm ${val} cấp hình phạt</span>`;
  if (eff === 'double_xp') return `<span class="chip" style="border-color:var(--gold);color:var(--gold)">⚡ x2 XP &amp; Điểm (${val} quest)</span>`;
  if (eff === 'freeze_decay') return `<span class="chip hot">❄️ Đóng băng chỉ số (${val} ngày)</span>`;
  if (eff === 'relax_persona') return `<span class="chip ok">🌿 Tính cách Thoải mái (${val} ngày)</span>`;
  return '';
}

function activeBuffsBannerHtml() {
  const b = (state && state.active_buffs) || {};
  const parts = [];
  if (state && state.skip_today) parts.push('🎫 <b>Vé Skip Ngày</b> đang bật (miễn phạt hôm nay)');
  if (b.double_xp_charges > 0) parts.push(`⚡ <b>Buff x2 XP &amp; Điểm</b>: còn <b>${b.double_xp_charges}</b> nhiệm vụ`);
  if (b.immune_shields && b.immune_shields.length) {
    parts.push(`🛡️ <b>Khiên Miễn Nhiễm Hình Phạt</b> chờ sẵn: ${b.immune_shields.map((lv) => `<b>Cấp ≤ ${lv}</b>`).join(', ')}`);
  }
  if (b.relax_persona_until) parts.push(`🌿 <b>Tính cách Thoải Mái</b>: đến hết <b>${fmtDayFull(b.relax_persona_until)}</b> (Không ép bắt buộc • Giảm 2 cấp phạt)`);
  if (b.decay_shield_until) parts.push(`❄️ <b>Khiên Đóng Băng Chỉ Số</b>: đến hết <b>${fmtDayFull(b.decay_shield_until)}</b>`);
  if (!parts.length) return '';
  return `<div class="panel" style="padding:10px 16px;margin-top:12px;border-color:var(--ok);display:flex;flex-wrap:wrap;gap:14px;align-items:center"><span style="color:var(--ok);font-weight:700">✨ Hiệu ứng bảo hộ &amp; Buff đang bật:</span>${parts.map((p) => `<span class="chip ok" style="font-size:13px;padding:3px 10px">${p}</span>`).join('')}</div>`;
}

function itemCard(it, canBuy) {
  const c = tierColor(it.tier_idx);
  const canBypassLock = ['punish_immune', 'reduce_punish', 'skip_ticket', 'skip_quest'].includes(it.effect);
  const lockedForItem = state.shop_locked && !canBypassLock;
  const afford = state.player.points >= it.price && !lockedForItem;
  return `<article class="card panel" style="--c:${c}">
    <div><h3>${esc(it.name)}</h3>
      <div class="chips"><span class="chip tier">${esc(it.tier_name)}</span><span class="chip">${KIND_ITEM[it.kind]}</span>${effectBadgeHtml(it.effect, it.effect_val)}${it.actions.length ? `<span class="chip">${it.actions.length} hành động tự mở</span>` : ''}</div>
      ${it.note ? `<p class="hint" style="margin:8px 0 0">${esc(it.note)}</p>` : ''}</div>
    <div class="reward"><span class="g">${it.price} điểm</span></div>
    <div class="card-actions">${canBuy
      ? `<button class="btn sm main" ${afford ? '' : 'disabled'} onclick="twoStep(this,'Bấm lần nữa để mua',()=>buyItem(${it.id}))">${afford ? 'Mua' : (lockedForItem ? 'Đang khóa (còn nợ)' : 'Chưa đủ điểm')}</button><button class="btn sm ghost" onclick="duplicateItem(${it.id})" title="Nhân bản phần thưởng này để tạo nhanh">Nhân bản</button>`
      : `<button class="btn sm" onclick="openItemEditor(${it.id})">Sửa</button><button class="btn sm" onclick="duplicateItem(${it.id})">Nhân bản</button><button class="btn sm danger" onclick="twoStep(this,'Bấm lần nữa để xóa',()=>deleteItem(${it.id}))">Xóa</button>`}</div>
  </article>`;
}

function renderShop() {
  const unused = state.inventory.filter((x) => !x.used_at);
  const used = state.inventory.filter((x) => x.used_at).slice(0, 15);
  const tabs = [
    ['buy', '🛒 Cửa hàng'],
    ['gacha', '🎲 Quay Gacha'],
    ['bag', `🎒 Túi đồ (${unused.length})`],
    ['manage', '⚙️ Quản lý phần thưởng'],
  ];
  let body = '';
  if (shopTab === 'bag') {
    const groups = new Map();
    unused.forEach((x) => { const g = groups.get(x.item_id); if (g) g.count++; else groups.set(x.item_id, { first: x, count: 1 }); });
    const list = [...groups.values()].sort((a, b) => b.first.tier_idx - a.first.tier_idx || a.first.name.localeCompare(b.first.name));
    body = `<div class="section">${list.length ? `<div class="items">${list.map(({ first: x, count }) => `
      <article class="card panel" style="--c:${tierColor(x.tier_idx)}">
        <div><h3>${esc(x.name)} ${count > 1 ? `<span class="invcount">x${count}</span>` : ''}</h3>
          <div class="chips"><span class="chip tier">${esc(x.tier_name)}</span><span class="chip">${KIND_ITEM[x.kind]}</span>${effectBadgeHtml(x.effect, x.effect_val)}${x.has_actions ? '<span class="chip">Tự mở khi dùng</span>' : ''}</div>
          ${x.note ? `<p class="hint" style="margin:8px 0 0">${esc(x.note)}</p>` : ''}</div><div></div>
        <div class="card-actions"><button class="btn sm main" onclick="twoStep(this,'Bấm lần nữa để dùng',()=>useItem(${x.id}))">Dùng ngay</button></div></article>`).join('')}</div>`
      : '<div class="panel empty"><h2>Túi đồ đang trống</h2><p>Hoàn thành quest để kiếm điểm, rồi mua hoặc quay gacha ở tab Cửa hàng / Quay Gacha.</p></div>'}</div>
      ${used.length ? `<div class="section"><h2>Đã dùng gần đây</h2><section class="panel" style="padding:6px 20px;margin-top:10px">${used.map((x) => `<div class="setting"><span>${esc(x.name)}</span><span class="hint">${esc(x.used_at.slice(0, 16).replace('T', ' '))}</span></div>`).join('')}</section></div>` : ''}`;

    if (!state.items.length) {
      body = `<div class="panel empty"><h2>Chưa có phần thưởng nào</h2><p>Bạn tự nhập danh sách phần thưởng và gán độ hiếm cho từng món.</p><button class="btn main" onclick="openItemEditor()">Thêm phần thưởng</button></div>`;
    } else {
      body = state.tiers.filter((t) => state.items.some((i) => i.tier_id === t.id)).map((t) => `
        <div class="tier-head" style="--c:${tierColor(t.idx)}"><h2>${esc(t.name)}</h2><span>${shopTab === 'buy' ? 'Giá mua mặc định ' + t.buy_price + ' điểm' : state.items.filter((i) => i.tier_id === t.id).length + ' món'}</span></div>

/* ----- túi đồ ----- */
function renderInventory() {
  const unused = state.inventory.filter((x) => !x.used_at);
  const used = state.inventory.filter((x) => x.used_at).slice(0, 15);
  const groups = new Map();
  unused.forEach((x) => { const g = groups.get(x.item_id); if (g) g.count++; else groups.set(x.item_id, { first: x, count: 1 }); });
  const list = [...groups.values()].sort((a, b) => b.first.tier_idx - a.first.tier_idx || a.first.name.localeCompare(b.first.name));
  $('#view').innerHTML = `<h1>Túi đồ</h1><p class="sub">Phần thưởng bạn đã mua hoặc quay được. Bấm Dùng khi muốn tận hưởng.</p>
    <div class="section">${list.length ? `<div class="items">${list.map(({ first: x, count }) => `
      <article class="card panel" style="--c:${tierColor(x.tier_idx)}">
        <div><h3>${esc(x.name)} ${count > 1 ? `<span class="invcount">x${count}</span>` : ''}</h3>
          <div class="chips"><span class="chip tier">${esc(x.tier_name)}</span><span class="chip">${KIND_ITEM[x.kind]}</span>${effectBadgeHtml(x.effect, x.effect_val)}${x.has_actions ? '<span class="chip">Tự mở khi dùng</span>' : ''}</div>
          ${x.note ? `<p class="hint" style="margin:8px 0 0">${esc(x.note)}</p>` : ''}</div><div></div>
        <div class="card-actions"><button class="btn sm main" onclick="twoStep(this,'Bấm lần nữa để dùng',()=>useItem(${x.id}))">Dùng</button></div></article>`).join('')}</div>`
      : '<div class="panel empty"><h2>Túi đồ trống</h2><p>Hoàn thành quest để kiếm điểm, rồi mua hoặc quay gacha ở Cửa hàng.</p></div>'}</div>
    ${used.length ? `<div class="section"><h2>Đã dùng gần đây</h2><section class="panel" style="padding:6px 20px;margin-top:10px">${used.map((x) => `<div class="setting"><span>${esc(x.name)}</span><span class="hint">${esc(x.used_at.slice(0, 16).replace('T', ' '))}</span></div>`).join('')}</section></div>` : ''}`;
}
