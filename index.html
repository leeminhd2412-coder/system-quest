    <section class="panel" style="padding:6px 22px;margin-top:8px">${d.backups.length ? d.backups.map((b) => `<div class="setting">
      <span><code>${esc(b.name)}</code> <span class="hint" style="margin-left:8px">${esc(b.mtime)}, ${Math.max(1, Math.round(b.size / 1024))} KB</span></span>
      <span class="row"><button class="btn sm ghost" onclick="twoStep(this,'Bấm lần nữa để nạp các phần đã tick từ bản này',()=>restoreBackup('${esc(b.name)}'))">Khôi phục phần đã chọn</button></span></div>`).join('') : '<p class="hint">Chưa có bản sao lưu nào.</p>'}</section>
    <p class="hint" style="margin-top:10px">App tự chụp một bản mỗi ngày (giữ 7 ngày), một bản trước mỗi lần nâng cấp (giữ 5 bản) và tự sao lưu trước mỗi lần bạn nạp dữ liệu.</p>`;
}

async function openDataDir() { const r = await api().open_data_dir(); if (!r.ok) toast(r.error, true); }
async function openPartsDir() { const r = await api().open_parts_dir(); if (!r.ok) toast(r.error, true); }

async function exportSelectedParts() {
  const keys = getCheckedParts();
  if (!keys.length) return toast('Hãy tick chọn ít nhất một phần để xuất.', true);
  const folder = await api().pick_path('folder');
  if (!folder) return;
  const r = await api().export_parts_to(folder, keys);
  if (!r.ok) return toast(r.error, true);
  toast('Đã xuất ' + r.files.length + ' file vào: ' + r.dir);
}

async function _runImport(keys, sourcePath) {
  const mode = ($('#importMode') && $('#importMode').value) || importModeState || 'merge';
  const r = await api().import_parts(keys, mode, sourcePath);
  if (!r.ok) return toast(r.error || 'Không nạp được dữ liệu.', true);
  localSugg = null;
  toast('Đã nạp thành công (' + (r.mode === 'replace' ? 'Thay thế' : 'Gộp') + '): ' + r.labels.join(', ') + '.');
  await refresh({ resetInputs: true });
}

async function importFromPickedFile() {
  const keys = getCheckedParts();
  const path = await api().pick_path('data_file');
  if (!path) return;
  await _runImport(keys.length ? keys : null, path);
}

async function importFromPickedFolder() {
  const keys = getCheckedParts();
  if (!keys.length) return toast('Hãy tick chọn ít nhất một phần cần nạp.', true);
  const folder = await api().pick_path('folder');
  if (!folder) return;
  await _runImport(keys, folder);
}

async function importFromCurrentParts() {
  const keys = getCheckedParts();
  if (!keys.length) return toast('Hãy tick chọn ít nhất một phần cần nạp.', true);
  await _runImport(keys, null);
}

async function loadSinglePartFromDisk(partKey) {
  const path = await api().pick_path('data_file');
  if (!path) return;
  await _runImport([partKey], path);
}

async function restoreBackup(name) {
  const keys = getCheckedParts();
  if (!keys.length) return toast('Hãy tick chọn ít nhất một phần ở bảng trên để khôi phục.', true);
  const mode = ($('#importMode') && $('#importMode').value) || importModeState || 'replace';
  const r = await api().restore_backup_file(name, keys, mode);
  if (!r.ok) return toast(r.error || 'Không khôi phục được.', true);
  localSugg = null;
  toast('Đã khôi phục từ ' + name + ': ' + r.labels.join(', ') + '.');
  await refresh({ resetInputs: true });
}

async function backupNow() {
  const r = await api().backup_now();
  if (!r.ok) return toast(r.error || 'Không sao lưu được.', true);
  toast('Đã sao lưu: ' + r.name);
  loadDataTab();
}
async function dataNotice() {
  try {
    const d = await api().data_info();
    if (d.error) toast(d.error, true);
    if (d.notice) { toast('Dữ liệu bản cũ đã được chép sang ' + d.dir + '. Từ nay cập nhật app không còn đụng tới dữ liệu.'); api().ack_data_notice(); }
    if (d.auto_loaded && d.auto_loaded.length) {
      toast('Đã tự động nạp dữ liệu mới từ file từng phần: ' + d.auto_loaded.join(', ') + '.');
    }
  } catch (e) { /* bỏ qua */ }
}

/* ================= ĐỒNG BỘ ĐIỆN THOẠI (LAN / PWA / APK) & ĐÁM MÂY GITHUB GIST MIỄN PHÍ ================= */
async function openMobileSyncModal() {
  let info = { lan_urls: [window.location.origin], cloud: (state && state.cloud_sync) || _loadLocalCloudCfg() };
  try {
    const r = await api().get_mobile_sync_info();
    if (r && r.ok) info = r;
  } catch (e) {}
  const lanUrl = (info.lan_urls && info.lan_urls[0]) || window.location.href;
  const cloud = info.cloud || {};
  const qrLanImg = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(lanUrl)}`;
  const ghPagesShareUrl = (cloud.gist_id && cloud.token)
    ? `${lanUrl.split("?")[0]}?sync_gist=${encodeURIComponent(cloud.gist_id)}&sync_token=${encodeURIComponent(cloud.token)}`
    : "";
  const qrCloudImg = ghPagesShareUrl
    ? `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(ghPagesShareUrl)}`
    : "";

  showModal(`
    <h1>📱 Cài App Điện thoại &amp; Đồng bộ 2 Chiều Miễn phí</h1>
    <p class="sub">Dùng chung 1 Hệ thống giữa Điện thoại và Máy tính hoàn toàn miễn phí, không cần tải file âm thanh về điện thoại.</p>

    <div class="panel" style="padding:14px 16px;margin-top:12px;border-color:var(--edge)">
      <div class="row between" style="flex-wrap:wrap;gap:12px;align-items:center">
        <div style="flex:1;min-width:240px">
          <b style="color:var(--edge);font-size:15.5px">Cách 1: Mở trực tiếp từ Máy tính qua Wi-Fi (0 thao tác cấu hình)</b>
          <p class="hint" style="margin:6px 0">1. Đảm bảo Điện thoại và Máy tính dùng chung Wi-Fi (hoặc Tailscale).<br>
          2. Dùng camera điện thoại quét mã QR bên cạnh (hoặc nhập địa chỉ bên dưới vào Chrome trên điện thoại).<br>
          3. Trên Chrome điện thoại, bấm <b>Menu (⋮) → "Thêm vào màn hình chính / Cài đặt ứng dụng"</b> để biến thành App toàn màn hình như APK!</p>
          <div class="row" style="gap:8px;margin-top:8px;flex-wrap:wrap">
            <code style="padding:6px 10px;background:rgba(0,0,0,.45);border-radius:6px;color:var(--gold);font-size:14px">${esc(lanUrl)}</code>
            <button type="button" class="btn sm ghost" onclick="copyName('${esc(lanUrl)}')">📋 Chép link</button>
          </div>
        </div>
        <div style="text-align:center;background:#fff;padding:8px;border-radius:10px">
          <img src="${qrLanImg}" alt="QR LAN" width="135" height="135" style="display:block">
          <span style="color:#000;font-size:11px;font-weight:700">Quét mở ngay</span>
        </div>
      </div>
    </div>

    <div class="panel" style="padding:14px 16px;margin-top:12px;border-color:var(--gold)">
      <b style="color:var(--gold);font-size:15.5px">Cách 2: Đồng bộ Đám mây 2 chiều qua GitHub Gist (Dùng cả khi TẮT máy tính / Up GitHub Pages / Đóng gói APK)</b>
      <p class="hint" style="margin:6px 0">Chỉ cần dán 1 mã <b>GitHub Personal Access Token</b> (tạo miễn phí tại <code>github.com/settings/tokens</code>, tích chọn quyền <b><code>gist</code></b>). Hệ thống sẽ tự tạo kho lưu trữ ngầm và tự động đồng bộ 2 chiều giữa Điện thoại và PC!</p>
      <div class="grid2" style="margin-top:10px">
        <label class="f">GitHub Token (quyền gist)
          <input type="password" id="syncGhToken" value="${esc(cloud.token || "")}" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
        </label>
        <label class="f">Gist ID (Để trống sẽ tự động tạo mới)
          <input type="text" id="syncGistId" value="${esc(cloud.gist_id || "")}" placeholder="Tự động tạo hoặc dán Gist ID sẵn có">
        </label>
      </div>
      <div class="row between" style="margin-top:10px;flex-wrap:wrap;gap:8px">
        <span class="hint" id="syncStatusTxt">Trạng thái: <b style="color:${cloud.enabled ? "#44e69e" : "var(--mist)"}">${esc(cloud.last_status || (cloud.enabled ? "Đã bật tự động đồng bộ" : "Chưa bật"))}</b></span>
        <div class="row" style="gap:8px;flex-wrap:wrap">
          ${cloud.enabled ? `<button type="button" class="btn sm" onclick="runManualCloudSync('pull')">⬇️ Tải từ Đám mây về</button>
          <button type="button" class="btn sm" onclick="runManualCloudSync('push')">⬆️ Đẩy lên Đám mây</button>` : ""}
          <button type="button" class="btn sm main" onclick="saveCloudSyncSettings()">💾 Lưu &amp; Kết nối Tự động</button>
        </div>
      </div>
      ${qrCloudImg ? `<div class="row between" style="margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.1);flex-wrap:wrap;gap:10px">
        <div style="flex:1;min-width:220px">
          <b style="color:#44e69e;font-size:13.5px">✨ Mã QR Tự động Đăng nhập Đám mây trên Điện thoại:</b>
          <p class="hint" style="margin:4px 0 0">Quét mã QR này bằng điện thoại (hoặc mở trên bản GitHub Pages), điện thoại sẽ <b>tự động nạp luôn Token &amp; Gist ID</b> mà bạn không cần gõ lại bất kỳ ký tự nào!</p>
        </div>
        <div style="text-align:center;background:#fff;padding:6px;border-radius:8px">
          <img src="${qrCloudImg}" alt="QR Cloud Login" width="120" height="120" style="display:block">
        </div>
      </div>` : ""}
    </div>

    <div class="modal-foot">
      <button type="button" class="btn ghost" onclick="closeModal()">Đóng</button>
    </div>
  `, true);
}

async function saveCloudSyncSettings() {
  const tok = ($("#syncGhToken") && $("#syncGhToken").value || "").trim();
  const gid = ($("#syncGistId") && $("#syncGistId").value || "").trim();
  const stEl = $("#syncStatusTxt");
  if (stEl) stEl.innerHTML = "⏳ <i>Đang kết nối với GitHub Gist...</i>";
  const r = await api().configure_cloud_sync(tok, gid);
  if (!r || !r.ok) {
    if (stEl) stEl.innerHTML = `<span style="color:var(--alert)">⚠️ ${esc((r && r.error) || "Lỗi kết nối")}</span>`;
    return toast((r && r.error) || "Không kết nối được GitHub Gist.", true);
  }
  toast(r.message || "Đã bật đồng bộ đám mây tự động!");
  await refresh({ resetInputs: true });
  openMobileSyncModal();
}

async function runManualCloudSync(dir) {
  const stEl = $("#syncStatusTxt");
  if (stEl) stEl.innerHTML = "⏳ <i>Đang đồng bộ dữ liệu...</i>";
  const r = await api().cloud_sync_now(dir || "auto");
  if (!r || !r.ok) return toast((r && r.error) || "Lỗi đồng bộ.", true);
  localSugg = null;
  toast(r.message || "Đã đồng bộ thành công!");
  await refresh({ resetInputs: true });
  openMobileSyncModal();
}

/* ================= khởi động đa nền tảng (PC pywebview + Mobile Browser / PWA / APK) ================= */
let _appBooted = false;
async function bootSystemApp() {
  if (_appBooted) return;
  _appBooted = true;
  if ("serviceWorker" in navigator && window.location.protocol.startsWith("http")) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
  // Nếu chạy chế độ độc lập trên điện thoại và đã có cấu hình Cloud Sync, tự động kéo bản mới nhất về trước
  const localCloud = _loadLocalCloudCfg();
  if (!window.pywebview && localCloud.token && localCloud.gist_id) {
    try { await _standaloneCloudPull(); } catch (e) {}
  }
  await refresh();
  checkLockScreen();
  if (!isAppLocked()) {
    runPostUnlockInit();
  }
  setInterval(async () => {   // cập nhật giờ; đổi buổi thì gợi ý lại
    if (nowMin() < quietEndMin()) awake = false;   // qua 0h: coi như bạn đã đi ngủ, tới khi bạn quay lại app
    if (isUserEditing()) { $('#clock').textContent = new Date().toTimeString().slice(0, 5); return; }
    const old = state.window ? state.window.id : 0;
    await refresh();
    maybeShowDecay();
    maybeShowWeeklyReview();
    const cur = state.window ? state.window.id : 0;
    if (cur !== old && !isQuiet()) toast(state.window ? 'Đã vào khung giờ ' + state.window.name + ', hệ thống gợi ý quest mới.' : 'Đã ra khỏi khung giờ gợi ý, chỉ gợi ý quest "Mọi lúc".');
  }, 30000);
}

window.addEventListener('pywebviewready', () => bootSystemApp());
window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    if (!_appBooted) bootSystemApp();
  }, 180);
});
</script>
