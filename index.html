function renderView(opts = {}) {
  const curKey = viewStateKey();
  const sameView = (curKey === lastRenderedViewKey) && !opts.resetInputs;
  const snap = sameView ? captureViewState(opts.clearIds || []) : null;
  if (!sameView) viewDirty = false;
  lastRenderedViewKey = curKey;
  ({ today: renderToday, quests: renderQuests, calendar: renderCalendar, goals: renderGoals, stats: renderStats, analytics: renderAnalytics, ai: renderAiAssistant, shop: renderShop, inventory: renderInventory, settings: renderSettings })[currentView]();
  if (isAutoUiMode() && currentView !== 'today') {
    $('#view').insertAdjacentHTML('afterbegin', autoCommandHeroHtml(true));
  }
  if (snap) restoreViewState(snap);
}

/* ================= thao tác ================= */
document.querySelectorAll('.nav').forEach((b) => b.addEventListener('click', () => {
  if (b.dataset.view !== 'stats') statsEditMode = false;
  currentView = b.dataset.view;
  viewDirty = false;
  document.querySelectorAll('.nav').forEach((x) => x.classList.toggle('on', x === b));
  renderView({ resetInputs: true });
}));

async function swapQuest(id) {
  const next = await api().swap_suggestion(localSugg, id);
  if (next == null) { toast('Không còn quest nào khác phù hợp để đổi.'); return; }
  swapOver[id] = next;
  renderToday();
}

async function deleteQuest(id) {
  const btn = $('#del' + id);
  if (btn.dataset.sure !== '1') { btn.dataset.sure = '1'; btn.textContent = 'Bấm lần nữa để xóa'; setTimeout(() => { if (btn.isConnected) { btn.dataset.sure = ''; btn.textContent = 'Xóa'; } }, 3000); return; }
  await api().delete_quest(id);
  localSugg = null;
  toast('Đã xóa quest.');
  refresh();
}

async function addGroup() {
  const r = await api().add_group($('#newGroup').value);
  if (!r.ok) return toast(r.error, true);
  toast('Đã thêm nhóm chỉ số.');
  refresh({ clearIds: ['newGroup'] });
}
async function addStat(gid) {
  const r = await api().add_stat(gid, $('#ns' + gid).value);
  if (!r.ok) return toast(r.error, true);
  toast('Đã thêm chỉ số.');
  refresh({ clearIds: ['ns' + gid] });
}

async function setSetting(key, value) {
  const r = await api().set_setting(key, value);
  if (!r.ok) { toast(r.error, true); return; }
  if (key === 'suggest_count') localSugg = null;
  const keepDom = currentView === 'settings' && (settingsTab === 'general' || settingsTab === 'punish');
  await refresh({ skipView: keepDom });
}
async function testVoice(ev) {
  const url = await api().get_audio(ev);
  if (!url) return toast('Chưa có file cho thông báo này.', true);
  await playDataAudioUrl(url, '🔊 Đang nghe thử âm thanh thông báo...');
}
async function openVoiceDir() { const r = await api().open_voice_dir(); if (!r.ok) toast(r.error, true); }
async function changeVoiceDir() {
  const p = await api().pick_path('folder');
  if (!p) return;
  const r = await api().set_voice_dir(p);
  if (!r.ok) return toast(r.error, true);
  toast('Đã đổi thư mục giọng nói.'); refresh();
}
async function resetVoiceDir() { await api().set_voice_dir(''); toast('Đã dùng thư mục mặc định.'); refresh(); }
function rescanVoices() { refresh().then(() => toast('Đã quét lại thư mục giọng nói.')); }
function copyName(name) {
  try { navigator.clipboard.writeText(name).then(() => toast('Đã chép tên file: ' + name)); } catch (e) { toast('Tên file: ' + name); }
}
window.addEventListener('focus', () => { if (currentView === 'settings' && settingsTab === 'voice' && state && !isUserEditing()) refresh(); });   // vừa bỏ file vào thư mục rồi quay lại app

async function confirmDraft(qid, day) {
  const r = await api().confirm_draft(qid, day);
  if (!r.ok) toast(r.error, true); else { playVoice('quest_accept'); toast('Đã chốt: quest được tính là đã nhận cho ngày ' + fmtDay(day) + '.'); }
  localSugg = null; refresh();
}
async function discardDraft(qid, day) { await api().discard_draft(qid, day); refresh(); }
async function confirmAllDrafts(day) {
  const r = await api().confirm_all_drafts(day);
  if (r.count) { playVoice('quest_accept'); toast('Đã chốt ' + r.count + ' quest cho ngày ' + fmtDay(day) + '. Các quest này được tính là đã nhận.'); }
  localSugg = null; refresh();
}

/* ================= modal ================= */
function showModal(html, wide) {
  const m = $('#modal');
  m.innerHTML = `<div class="modal-box panel ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}</div>`;
  m.classList.remove('hidden');
}
function closeModal() { $('#modal').classList.add('hidden'); $('#modal').innerHTML = ''; }
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !active) {
    if (!$('#modal').classList.contains('hidden')) {
      if (isInputEl(document.activeElement) && $('#modal').contains(document.activeElement)) {
        document.activeElement.blur();
        return;
      }
      closeModal();
      return;
    }
    if (isAutoUiMode() && currentView !== 'today' && !isInputEl(document.activeElement)) {
      goView('today');
    }
  }
});
let modalBackdropDown = false;
$('#modal').addEventListener('mousedown', (e) => { modalBackdropDown = (e.target.id === 'modal'); });
$('#modal').addEventListener('mouseup', (e) => {
  if (modalBackdropDown && e.target.id === 'modal' && !active && !$('#modal .form')) closeModal();
  modalBackdropDown = false;
});

/* ----- chọn quest ----- */
function openQuest(id) {
  const q = byId(id);
  playVoice('quest_select');
  const canAccept = !q.is_penalty && !q.accepted && !q.done_today && q.status !== 'scheduled';
  const redoBanner = q.done_today
    ? `<div class="panel" style="margin-top:12px;padding:10px 14px;border-color:var(--edge)"><b style="color:var(--edge)">🔄 Làm lại nhiệm vụ trong ngày (Đã hoàn thành ${q.done_count_today || 1} lần hôm nay):</b><p class="hint" style="margin:4px 0 0">Khi làm thêm lần nữa, bạn nhận <b>70%</b> XP, điểm thưởng, điểm chỉ số (nhân theo chất lượng hoàn thành), không bị phạt nếu làm mức Vừa/Tệ và được cộng tăng trực tiếp vào <b>Độ siêng năng &amp; Điểm nghe lời</b>!</p></div>`
    : '';
  showModal(`
    <h1>${esc(q.title)}</h1><div class="chips">${chipsFor(q)}</div>
    <div style="margin-top:14px">${rewardFor(q).replace('class="reward"', 'class="reward" style="text-align:left"')}</div>
    ${redoBanner}
    ${q.accepted && !q.done_today ? '<p class="hint" style="margin-top:10px">Bạn đã nhận quest này: cần xong trước 0h, nếu không sẽ bị trừ điểm.</p>' : ''}
    ${q.actions.length ? `<h2 style="margin-top:18px">Khi bắt đầu, hệ thống sẽ mở</h2>
      <ul class="acts">${q.actions.map((a) => `<li><span class="k">${KIND_LABEL[a.kind]}</span><span class="t">${esc(a.target)}</span></li>`).join('')}</ul>` : '<p class="hint" style="margin-top:14px">Quest này chưa có hành động tự mở.</p>'}
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Để sau</button>
      <button class="btn ghost" onclick="openEditor(${q.id})">Sửa</button>
      <button class="btn ghost" onclick="duplicateQuest(${q.id})">Nhân bản</button>
      ${canAccept ? `<button class="btn" onclick="twoStep(this,'Bấm lần nữa để nhận (bỏ lỡ sẽ bị trừ điểm)',()=>{closeModal();acceptQuest(${q.id})})">Nhận quest</button>` : ''}
      <button class="btn ok-btn" onclick="openDirectCompleteModal(${q.id})" title="Đánh dấu nhiệm vụ đã làm xong từ trước (ghi nhận đủ thời gian ước tính)">✓ Đã hoàn thành</button>
      <button class="btn main" onclick="startQuest(${q.id})">▶ Bắt đầu làm</button></div>`);
}

/* ----- đang làm quest (hỗ trợ Đếm ngược, Bấm giờ, Pomodoro, Tạm dừng, Lưu phiên & Thu nhỏ nổi) ----- */
let lastSessionSync = 0;

function syncActiveSession(force = false) {
  if (!active) { api().save_active_session(null); return; }
  if (!force && Date.now() - lastSessionSync < 4000) return;
  lastSessionSync = Date.now();
  const copy = Object.assign({}, active);
  delete copy.iv;
  api().save_active_session(copy);
}

function getWorkElapsed(a) {
  if (!a) return 0;
  const seg = (!a.paused && (!a.pomoOn || a.phase === 'work')) ? (Date.now() - a.lastResumed) / 1000 : 0;
  return Math.max(0, (a.workAccum || 0) + seg);
}

function getPhaseElapsed(a) {
  if (!a) return 0;
  const seg = !a.paused ? (Date.now() - a.lastResumed) / 1000 : 0;
  return Math.max(0, (a.phaseElapsed || 0) + seg);
}

function currentPhaseDurationSec(a) {
  if (a.phase === 'work') return (a.workMin || 25) * 60;
  if (a.phase === 'long_break') return (a.longBreakMin || 15) * 60;
  return (a.breakMin || 5) * 60;
}

async function startQuest(id) {
  const q = byId(id);
  playVoice('quest_start');
  const res = await api().start_quest(id);
  const s = state.settings;
  const isPomo = q.timer_mode === 'pomodoro';
  active = {
    id,
    title: q.title,
    started_date: state.date,
    mode: q.timer_mode,
    pomoOn: isPomo,
    workMin: q.pomo_work || s.pomo_work || 25,
    breakMin: q.pomo_break || s.pomo_break || 5,
    longBreakMin: s.pomo_long_break || 15,
    cyclesBeforeLong: s.pomo_cycles || 4,
    phase: 'work',
    cycle: 1,
    phaseElapsed: 0,
    workAccum: 0,
    total: (q.duration_min || 0) * 60,
    paused: false,
    lastResumed: Date.now(),
    alerted: false,
    mini: false,
    results: res.results || [],
    iv: null,
  };
  syncActiveSession(true);
  renderActive();
  active.iv = setInterval(tick, 250);
}

function restoreActiveSessionIfAny() {
  if (restoredSessionOnce || active || !state || !state.active_session) return;
  restoredSessionOnce = true;
  const saved = state.active_session;
  const q = byId(saved.id);
  if (!q || q.done_today) { api().save_active_session(null); return; }
  active = Object.assign({}, saved, { iv: null, mini: false });
  if (!active.paused) {
    // Tính tiếp từ thời điểm lưu gần nhất
    active.lastResumed = saved.lastResumed || Date.now();
  }
  renderActive();
  active.iv = setInterval(tick, 250);
  toast('Đã khôi phục phiên làm quest đang dở: ' + active.title);
}

function togglePauseQuest() {
  if (!active) return;
  if (!active.paused) {
    const seg = Math.max(0, (Date.now() - active.lastResumed) / 1000);
    active.phaseElapsed = (active.phaseElapsed || 0) + seg;
    if (!active.pomoOn || active.phase === 'work') active.workAccum = (active.workAccum || 0) + seg;
    active.paused = true;
  } else {
    active.paused = false;
    active.lastResumed = Date.now();
  }
  syncActiveSession(true);
  renderActive();
}

function toggleLivePomodoro() {
  if (!active) return;
  // Chốt thời gian đang chạy trước khi bật/tắt Pomodoro
  if (!active.paused) {
    const seg = Math.max(0, (Date.now() - active.lastResumed) / 1000);
    if (!active.pomoOn || active.phase === 'work') active.workAccum = (active.workAccum || 0) + seg;
    active.lastResumed = Date.now();
  }
  active.pomoOn = !active.pomoOn;
  active.phase = 'work';
  active.phaseElapsed = 0;
  if (!active.workMin) active.workMin = state.settings.pomo_work || 25;
  if (!active.breakMin) active.breakMin = state.settings.pomo_break || 5;
  syncActiveSession(true);
  renderActive();
}

function updateLivePomoLengths(w, b) {
  if (!active) return;
  const nw = Math.max(1, Math.min(240, +w || 25));
  const nb = Math.max(1, Math.min(120, +b || 5));
  active.workMin = nw;
  active.breakMin = nb;
  syncActiveSession(true);
  tick();
}

function nextPomoPhase(autoTriggered = false) {
  if (!active || !active.pomoOn) return;
  if (!active.paused) {
    const seg = Math.max(0, (Date.now() - active.lastResumed) / 1000);
    if (active.phase === 'work') active.workAccum = (active.workAccum || 0) + seg;
  }
  if (active.phase === 'work') {
    const isLong = (active.cycle % (active.cyclesBeforeLong || 4)) === 0;
    active.phase = isLong ? 'long_break' : 'break';
    if (autoTriggered) {
      beep();
      if (state.settings.notifications) {
        toast(`🍅 Xong phiên Tập trung #${active.cycle}! Nghỉ giải lao ${isLong ? active.longBreakMin : active.breakMin} phút.`);
      }
    }
  } else {
    active.phase = 'work';
    active.cycle = (active.cycle || 1) + 1;
    if (autoTriggered) {
      beep();
      if (state.settings.notifications) {
        toast(`🍅 Hết giờ nghỉ! Bắt đầu phiên Tập trung #${active.cycle}.`);
      }
    }
  }
  active.phaseElapsed = 0;
  active.lastResumed = Date.now();
  syncActiveSession(true);
  renderActive();
}

async function toggleMiniMode() {
  if (!active) return;
  active.mini = !active.mini;
  document.body.classList.toggle('mini-hud', active.mini);
  try { await api().set_mini_mode(active.mini); } catch (e) {}
  renderActive();
}

function exitMiniModeIfNeeded() {
  if (document.body.classList.contains('mini-hud')) {
    document.body.classList.remove('mini-hud');
    try { api().set_mini_mode(false); } catch (e) {}
  }
}

function renderActive() {
  const a = active;
  if (!a) return;
  const failed = (a.results || []).filter((r) => !r.ok);
  const hasTimer = a.mode !== 'none' || a.pomoOn;

  if (a.mini) {
    showModal(`
      <div class="row between"><b style="font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.title)}</b>
        ${a.pomoOn ? `<span class="pomo-phase ${a.phase === 'work' ? 'work' : 'brk'}" style="margin:0;font-size:12px">${a.phase === 'work' ? '🍅 Phiên #' + a.cycle : '☕ Nghỉ'}</span>` : ''}</div>
      <div class="timer" id="timerText">00:00</div>
      <div class="timer-note" id="timerNote" style="font-size:12px"></div>
      <div class="row between" style="margin-top:6px">
        <button class="btn sm" onclick="togglePauseQuest()">${a.paused ? '▶ Tiếp' : '⏸ Dừng'}</button>
        ${a.pomoOn ? `<button class="btn sm ghost" onclick="nextPomoPhase(false)">${a.phase === 'work' ? '☕ Nghỉ' : '🍅 Làm'}</button>` : ''}
        <button class="btn sm ghost" onclick="toggleMiniMode()">🗖 Mở rộng</button>
        <button class="btn sm main" onclick="finishQuest()">✓ Xong</button>
      </div>`);
    tick();
    return;
  }

  const pomoControls = `
    <div class="pomo-box">
      <div class="row between" style="flex-wrap:wrap">
        <div>
          ${a.pomoOn
            ? `<span class="pomo-phase ${a.phase === 'work' ? 'work' : 'brk'}" id="pomoBadge">${a.phase === 'work' ? `🍅 Phiên #${a.cycle} • Đang tập trung (${a.workMin}p)` : `☕ Đang nghỉ ${a.phase === 'long_break' ? 'dài' : 'ngắn'} (${a.phase === 'long_break' ? a.longBreakMin : a.breakMin}p)`}</span>`
            : '<span class="hint">🍅 Chế độ Pomodoro: chia giờ làm việc thành từng phiên tập trung &amp; nghỉ ngắn</span>'}
        </div>
        <div class="row" style="gap:6px">
          ${a.pomoOn ? `<button type="button" class="btn sm ghost" onclick="nextPomoPhase(false)">${a.phase === 'work' ? 'Chuyển sang Nghỉ' : 'Bỏ qua nghỉ → Tập trung'}</button>` : ''}
          ${a.mode !== 'pomodoro' ? `<button type="button" class="btn sm ${a.pomoOn ? 'main' : 'ghost'}" onclick="toggleLivePomodoro()">${a.pomoOn ? 'Tắt Pomodoro' : '🍅 Bật Pomodoro'}</button>` : ''}
        </div>
      </div>
      ${a.pomoOn ? `
        <div class="pomo-bar ${a.phase === 'work' ? '' : 'brk'}"><i id="pomoBarFill" style="width:0%"></i></div>
        <div class="row between" style="flex-wrap:wrap;margin-top:6px">
          <span class="pomo-sub" id="pomoSubText">Tổng thời gian đã tập trung: 00:00</span>
          <span class="row" style="gap:6px;font-size:12.5px;color:var(--mist)">
            Tập trung <input type="number" min="1" max="240" value="${a.workMin}" style="width:54px;padding:2px 6px" onchange="updateLivePomoLengths(this.value, ${a.breakMin})">p /
            Nghỉ <input type="number" min="1" max="120" value="${a.breakMin}" style="width:50px;padding:2px 6px" onchange="updateLivePomoLengths(${a.workMin}, this.value)">p
          </span>
        </div>` : ''}
    </div>`;

  showModal(`
    <div class="row between"><h1>${esc(a.title)}</h1>
      <button class="btn sm ghost" onclick="toggleMiniMode()" title="Thu gọn cửa sổ nổi trên góc màn hình">🗗 Thu nhỏ nổi</button></div>
    <p class="sub">${a.paused ? '⏸ Đang tạm dừng' : 'Quest đang diễn ra.'}</p>
    ${hasTimer ? `<div class="timer" id="timerText">00:00</div><div class="timer-note" id="timerNote"></div>` : ''}
    ${pomoControls}
    ${a.results.length ? `<ul class="acts">${a.results.map((r) => `<li><span class="k">${KIND_LABEL[r.kind]}</span><span class="t ${r.ok ? '' : 'bad'}">${esc(r.resolved || r.target)}${r.ok ? '' : ' - ' + esc(r.error)}</span></li>`).join('')}</ul>` : ''}
    ${failed.length ? '<p class="hint" style="margin-top:8px">Hành động lỗi không chặn quest. Sửa đường dẫn trong mục Quest, hoặc tự mở thủ công.</p>' : ''}
    <div class="modal-foot">
      <button class="btn ghost" onclick="cancelQuest()">Hủy quest</button>
      ${hasTimer ? `<button class="btn" onclick="togglePauseQuest()">${a.paused ? '▶ Tiếp tục' : '⏸ Tạm dừng'}</button>` : ''}
      <button class="btn main" onclick="finishQuest()">Hoàn thành</button>
    </div>`);
  tick();
}

function tick() {
  if (!active) return;
  syncActiveSession(false);
  const el = $('#timerText');
  const noteEl = $('#timerNote');
  const workSec = getWorkElapsed(active);
  const phaseSec = getPhaseElapsed(active);

  if (active.pomoOn) {
    const pDur = currentPhaseDurationSec(active);
    const pRem = pDur - phaseSec;
    if (pRem <= 0 && !active.paused) {
      nextPomoPhase(true);
      return;
    }
    const bar = $('#pomoBarFill');
    if (bar) bar.style.width = Math.min(100, Math.max(0, (phaseSec / pDur) * 100)).toFixed(1) + '%';
    const sub = $('#pomoSubText');
    if (sub) {
      const targetStr = active.total > 0 ? ` / mục tiêu ${fmt(active.total)}` : '';
      sub.textContent = `Tổng thời gian đã tập trung: ${fmt(workSec)}${targetStr}`;
    }
    if (el) {
      el.textContent = fmt(Math.ceil(Math.max(0, pRem)));
      el.classList.toggle('over', active.phase !== 'work');
    }
    if (noteEl) {
      if (active.mode === 'countdown' || (active.mode === 'pomodoro' && active.total > 0)) {
        const totRem = active.total - workSec;
        noteEl.textContent = totRem > 0
          ? `${active.phase === 'work' ? 'Còn lại trong phiên tập trung' : 'Thời gian nghỉ giải lao'} • Tổng mục tiêu còn ${fmt(Math.ceil(totRem))}`
          : `Đã đạt tổng thời lượng mục tiêu (${fmt(workSec)})! Bạn có thể bấm Hoàn thành.`;
      } else {
        noteEl.textContent = `${active.phase === 'work' ? 'Thời gian còn lại của phiên #' + active.cycle : 'Thời gian nghỉ giải lao'} • Đã tập trung ${fmt(workSec)}`;
      }
    }
    if (active.total > 0 && workSec >= active.total && !active.alerted) {
      active.alerted = true;
      playVoice('timer_end');
      if (state.settings.notifications) { toast('Đã đạt đủ thời lượng mục tiêu của quest: ' + active.title); beep(); }
    }
    return;
  }

  if (active.mode === 'none') return;
  if (!el) return;
  if (active.mode === 'stopwatch') {
    el.textContent = fmt(workSec);
    if (noteEl) noteEl.textContent = active.paused ? 'Đồng hồ đang tạm dừng' : 'Thời gian đã làm';
    return;
  }
  const remain = active.total - workSec;
  if (remain > 0) {
    el.textContent = fmt(Math.ceil(remain));
    if (noteEl) noteEl.textContent = active.paused ? 'Đồng hồ đang tạm dừng' : 'Thời gian còn lại';
    return;
  }
  el.textContent = fmt(0);
  el.classList.add('over');
  if (noteEl) noteEl.textContent = 'Hết giờ. Đã vượt ' + fmt(-remain) + '. Bấm Hoàn thành khi xong.';
  if (!active.alerted) {
    active.alerted = true;
    playVoice('timer_end');
    if (state.settings.notifications) { toast('Hết giờ quest: ' + active.title); beep(); }
  }
}

function stopTimer() { if (active && active.iv) clearInterval(active.iv); }
function cancelQuest() {
  stopTimer();
  exitMiniModeIfNeeded();
  active = null;
  api().save_active_session(null);
  closeModal();
}

async function undoLastAction() {
  const r = await api().undo_last_action();
  if (!r.ok) return toast(r.error, true);
  closeModal();
  localSugg = null;
  toast('Đã hoàn tác: ' + r.label);
  await refresh({ resetInputs: true });
}

function finishQuest() {
  if (!active) return;
  if (!active.paused) {
    const seg = Math.max(0, (Date.now() - active.lastResumed) / 1000);
    active.phaseElapsed = (active.phaseElapsed || 0) + seg;
    if (!active.pomoOn || active.phase === 'work') active.workAccum = (active.workAccum || 0) + seg;
    active.paused = true;
  }
  exitMiniModeIfNeeded();
  syncActiveSession(true);

  const q = byId(active.id) || { title: active.title, importance: 1, xp: 10, points: 5, is_penalty: 0 };
  const elapsed = Math.floor(getWorkElapsed(active));
  const levels = state.levels || [];
  let subInfo = '';
  let badPenTxt = '', medPenTxt = '', goodPenTxt = '', greatPenTxt = '';
  let badRewTxt = '', medRewTxt = '', goodRewTxt = '', greatRewTxt = '';

  if (q.is_penalty) {
    const debt = (state.debts || []).find((d) => d.chosen_quest_id === q.id);
    if (debt && levels.length) {
      const curIdx = Math.max(0, levels.findIndex((l) => l.id === debt.level_id));
      const curName = levels[curIdx] ? levels[curIdx].name : debt.level_name;
      const idxBad = curIdx - 1;
      const idxMed = curIdx - 2;
      subInfo = `Đang làm hình phạt gỡ khoản nợ <b>${esc(curName)}</b> • Thời gian làm: <b>${fmt(elapsed)}</b>`;
      badPenTxt = idxBad >= 0 ? `Giảm nhẹ 1 cấp (${esc(curName)} → hạ xuống ${esc(levels[idxBad].name)})` : `Giảm 1 cấp → Gỡ xong nợ`;
      medPenTxt = idxMed >= 0 ? `Giảm nhẹ 2 cấp (${esc(curName)} → hạ xuống ${esc(levels[idxMed].name)})` : `Giảm 2 cấp → Gỡ xong nợ`;
      goodPenTxt = `Gỡ hoàn toàn ${esc(curName)}`;
      greatPenTxt = `Gỡ hoàn toàn ${esc(curName)} (tối đa điểm hoàn lại)`;
    } else {
      subInfo = `Đang làm bù điểm chỉ số đã mất • Thời gian làm: <b>${fmt(elapsed)}</b>`;
      badPenTxt = 'Giảm nhẹ 1 bậc (hoàn trước 25% điểm)';
      medPenTxt = 'Giảm nhẹ 2 bậc (gỡ xong & hoàn 50% điểm)';
      goodPenTxt = 'Gỡ hoàn toàn khoản mất điểm (hoàn 75% điểm)';
      greatPenTxt = 'Gỡ hoàn toàn & hoàn Full 100% điểm làm bù';
    }
    badRewTxt = 'Hoàn 25% điểm chỉ số làm bù';
    medRewTxt = 'Hoàn 50% điểm chỉ số làm bù';
    goodRewTxt = 'Hoàn 75% điểm chỉ số làm bù';
    greatRewTxt = 'Hoàn Full 100% điểm chỉ số làm bù như đã cài đặt';
  } else {
    const imp = q.importance || 1;
    const isRedo = Boolean(q.done_today);
    const rFactor = isRedo ? 0.7 : 1.0;
    const impName = (state.importance_names && state.importance_names[imp]) || '';
    const baseLid = state.imp_map ? state.imp_map[String(imp)] : null;
    let baseIdx = levels.findIndex((l) => l.id === baseLid);
    if (baseIdx < 0) baseIdx = Math.min(imp - 1, Math.max(0, levels.length - 1));
    const baseName = levels[baseIdx] ? levels[baseIdx].name : 'Cấp 1';
    const idxBad = baseIdx - 1;
    const idxMed = baseIdx - 2;

    subInfo = isRedo
      ? `🔄 <b>Lượt làm thêm trong ngày (nhận 70% mức thưởng &amp; tăng Độ siêng năng)</b> • Đã làm: <b>${fmt(elapsed)}</b>`
      : `Độ quan trọng: <b>${imp}/5 (${esc(impName)})</b> • Nếu không làm sẽ bị phạt <b>${esc(baseName)}</b> • Đã làm: <b>${fmt(elapsed)}</b>`;
    badPenTxt = isRedo ? '✅ Lượt làm thêm: Không bị phạt' : (idxBad >= 0
      ? `⚖️ Nhẹ 1 cấp: Lẽ ra không làm phạt ${esc(baseName)} → chỉ phạt ${esc(levels[idxBad].name)}`
      : `⚖️ Nhẹ 1 cấp (gốc ${esc(baseName)}) → Được miễn phạt`);
    medPenTxt = isRedo ? '✅ Lượt làm thêm: Không bị phạt' : (idxMed >= 0
      ? `⚖️ Nhẹ 2 cấp: Lẽ ra không làm phạt ${esc(baseName)} → chỉ phạt ${esc(levels[idxMed].name)}`
      : `⚖️ Nhẹ 2 cấp (gốc ${esc(baseName)}) → Được miễn phạt`);
    goodPenTxt = '✅ Không bị phạt';
    greatPenTxt = isRedo ? '🌟 Cộng 70% Full chỉ số & thưởng • Tăng Siêng năng' : '🌟 Không bị phạt • Cộng Full 100% chỉ số';

    badRewTxt = `Cộng ${Math.round(25 * rFactor)}% chỉ số • +${Math.round(q.xp * 0.3 * rFactor)} XP, +${Math.round(q.points * 0.3 * rFactor)} điểm`;
    medRewTxt = `Cộng ${Math.round(50 * rFactor)}% chỉ số • +${Math.round(q.xp * 0.55 * rFactor)} XP, +${Math.round(q.points * 0.55 * rFactor)} điểm`;
    goodRewTxt = `Cộng ${Math.round(75 * rFactor)}% chỉ số • +${Math.round(q.xp * 0.8 * rFactor)} XP, +${Math.round(q.points * 0.8 * rFactor)} điểm`;
    greatRewTxt = `Cộng ${isRedo ? '70% (Làm lại)' : 'Full 100%'} chỉ số • +${Math.round(q.xp * rFactor)} XP, +${Math.round(q.points * rFactor)} điểm`;
  }

  showModal(`
    <h1>Đánh giá chất lượng hoàn thành</h1>
    <p class="sub" style="margin-bottom:4px"><b>${esc(q.title)}</b></p>
    <p class="hint" style="margin:0 0 10px">${subInfo}</p>
    <div class="qual-grid">
      <button type="button" class="qual-btn bad" id="btnQualBad" onclick="submitQuestCompletion('bad')">
        <b>😣 Tệ</b>
        <span class="q-pen">${badPenTxt}</span>
        <span class="q-rew">${badRewTxt}</span>
      </button>
      <button type="button" class="qual-btn med" id="btnQualMed" onclick="submitQuestCompletion('medium')">
        <b>😐 Vừa</b>
        <span class="q-pen">${medPenTxt}</span>
        <span class="q-rew">${medRewTxt}</span>
      </button>
      <button type="button" class="qual-btn good" id="btnQualGood" onclick="submitQuestCompletion('good')">
        <b>🙂 Khá tốt</b>
        <span class="q-pen" style="color:var(--edge)">${goodPenTxt}</span>
        <span class="q-rew">${goodRewTxt}</span>
      </button>
      <button type="button" class="qual-btn great" id="btnQualGreat" onclick="submitQuestCompletion('great')">
        <b>🌟 Rất tốt</b>
        <span class="q-pen" style="color:#44e69e">${greatPenTxt}</span>
        <span class="q-rew">${greatRewTxt}</span>
      </button>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="resumeFromQualityModal()">← Quay lại làm tiếp</button>
    </div>`, true);
}

function resumeFromQualityModal() {
  if (!active) { closeModal(); return; }
  renderActive();
}

function openDirectCompleteModal(qid) {
  const q = byId(qid);
  if (!q) return;
  const estMin = q.estimate || q.duration_min || state.settings.default_estimate || 20;
  const levels = state.levels || [];

  let badPenTxt = '', medPenTxt = '', goodPenTxt = '', greatPenTxt = '';
  let badRewTxt = '', medRewTxt = '', goodRewTxt = '', greatRewTxt = '';

  if (q.is_penalty) {
    const debt = (state.debts || []).find((d) => d.chosen_quest_id === q.id);
    if (debt && levels.length) {
      const curIdx = Math.max(0, levels.findIndex((l) => l.id === debt.level_id));
      const curName = levels[curIdx] ? levels[curIdx].name : debt.level_name;
      const idxBad = curIdx - 1;
      const idxMed = curIdx - 2;
      subInfo = `Đánh dấu đã hoàn thành hình phạt gỡ khoản nợ <b>${esc(curName)}</b>`;
      badPenTxt = idxBad >= 0 ? `Giảm nhẹ 1 cấp (${esc(curName)} → hạ xuống ${esc(levels[idxBad].name)})` : `Giảm 1 cấp → Gỡ xong nợ`;

      greatPenTxt = `Gỡ hoàn toàn ${esc(curName)} (tối đa điểm hoàn lại)`;
    } else {
      subInfo = `Đánh dấu đã hoàn thành làm bù điểm chỉ số đã mất`;
      badPenTxt = 'Giảm nhẹ 1 bậc (hoàn trước 25% điểm)';
      medPenTxt = 'Giảm nhẹ 2 bậc (gỡ xong & hoàn 50% điểm)';
      goodPenTxt = 'Gỡ hoàn toàn khoản mất điểm (hoàn 75% điểm)';
      greatPenTxt = 'Gỡ hoàn toàn & hoàn Full 100% điểm làm bù';
    }
    badRewTxt = 'Hoàn 25% điểm chỉ số làm bù';
    medRewTxt = 'Hoàn 50% điểm chỉ số làm bù';
    goodRewTxt = 'Hoàn 75% điểm chỉ số làm bù';
    greatRewTxt = 'Hoàn Full 100% điểm chỉ số làm bù như đã cài đặt';
  } else {
    const imp = q.importance || 1;
    const isRedo = Boolean(q.done_today && !q.skipped_today);
    const rFactor = isRedo ? 0.7 : 1.0;
    const impName = (state.importance_names && state.importance_names[imp]) || '';
    const baseLid = state.imp_map ? state.imp_map[String(imp)] : null;
    let baseIdx = levels.findIndex((l) => l.id === baseLid);
    if (baseIdx < 0) baseIdx = Math.min(imp - 1, Math.max(0, levels.length - 1));
    const baseName = levels[baseIdx] ? levels[baseIdx].name : 'Cấp 1';
    const idxBad = baseIdx - 1;
    const idxMed = baseIdx - 2;

    subInfo = isRedo
      ? `🔄 <b>Lượt làm thêm trong ngày (nhận 70% mức thưởng &amp; tăng Độ siêng năng)</b>`
      : `Độ quan trọng: <b>${imp}/5 (${esc(impName)})</b> • Nếu không làm sẽ bị phạt <b>${esc(baseName)}</b>`;
    badPenTxt = isRedo ? '✅ Lượt làm thêm: Không bị phạt' : (idxBad >= 0
      ? `⚖️ Nhẹ 1 cấp: Lẽ ra không làm phạt ${esc(baseName)} → chỉ phạt ${esc(levels[idxBad].name)}`
      : `⚖️ Nhẹ 1 cấp (gốc ${esc(baseName)}) → Được miễn phạt`);
    medPenTxt = isRedo ? '✅ Lượt làm thêm: Không bị phạt' : (idxMed >= 0
      ? `⚖️ Nhẹ 2 cấp: Lẽ ra không làm phạt ${esc(baseName)} → chỉ phạt ${esc(levels[idxMed].name)}`
      : `⚖️ Nhẹ 2 cấp (gốc ${esc(baseName)}) → Được miễn phạt`);
    goodPenTxt = '✅ Không bị phạt';
    greatPenTxt = isRedo ? '🌟 Cộng 70% Full chỉ số & thưởng • Tăng Siêng năng' : '🌟 Không bị phạt • Cộng Full 100% chỉ số';

    badRewTxt = `Cộng ${Math.round(25 * rFactor)}% chỉ số • +${Math.round(q.xp * 0.3 * rFactor)} XP, +${Math.round(q.points * 0.3 * rFactor)} điểm`;
    medRewTxt = `Cộng ${Math.round(50 * rFactor)}% chỉ số • +${Math.round(q.xp * 0.55 * rFactor)} XP, +${Math.round(q.points * 0.55 * rFactor)} điểm`;
    goodRewTxt = `Cộng ${Math.round(75 * rFactor)}% chỉ số • +${Math.round(q.xp * 0.8 * rFactor)} XP, +${Math.round(q.points * 0.8 * rFactor)} điểm`;
    greatRewTxt = `Cộng ${isRedo ? '70% (Làm lại)' : 'Full 100%'} chỉ số • +${Math.round(q.xp * rFactor)} XP, +${Math.round(q.points * rFactor)} điểm`;
  }

  showModal(`
    <h1>✓ Xác nhận Đã hoàn thành nhiệm vụ</h1>
    <p class="sub" style="margin-bottom:4px"><b>${esc(q.title)}</b></p>
    <p class="hint" style="margin:0 0 10px">${subInfo}</p>
    <div class="panel" style="padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
      <div>
        <b>⏱️ Thời gian bạn đã dành cho nhiệm vụ này (phút):</b>
        <p class="hint" style="margin:2px 0 0;font-size:12px">Hệ thống điền sẵn thời lượng ước tính để Trợ lý ghi nhận chuẩn xác công sức của bạn (không báo nhầm hoàn thành sớm).</p>
      </div>
      <input type="number" id="directActualMin" min="1" max="600" value="${estMin}" style="width:90px;text-align:center;font-weight:700;font-size:16px">
    </div>
    <div class="qual-grid">
      <button type="button" class="qual-btn bad" onclick="submitDirectCompletion(${q.id}, 'bad')">
        <b>😣 Tệ</b>
        <span class="q-pen">${badPenTxt}</span>
        <span class="q-rew">${badRewTxt}</span>
      </button>
      <button type="button" class="qual-btn med" onclick="submitDirectCompletion(${q.id}, 'medium')">
        <b>😐 Vừa</b>
        <span class="q-pen">${medPenTxt}</span>
        <span class="q-rew">${medRewTxt}</span>
      </button>
      <button type="button" class="qual-btn good" onclick="submitDirectCompletion(${q.id}, 'good')">
        <b>🙂 Khá tốt</b>
        <span class="q-pen" style="color:var(--edge)">${goodPenTxt}</span>
        <span class="q-rew">${goodRewTxt}</span>
      </button>

        <span class="q-rew">${greatRewTxt}</span>
      </button>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" onclick="closeModal()">Hủy</button>
    </div>`, true);
}

async function submitDirectCompletion(qid, quality) {
  const q = byId(qid);
  const estMin = q ? (q.estimate || q.duration_min || 20) : 20;
  const minVal = Math.max(1, parseInt(($('#directActualMin') && $('#directActualMin').value) || estMin, 10) || estMin);
  if (active && active.id === qid) {
    stopTimer();
    exitMiniModeIfNeeded();
    active = null;
  }
  const res = await api().complete_quest(qid, minVal * 60, quality || 'good');
  if (!res.ok) { closeModal(); toast(res.error, true); return; }
  showCompletionResultModal(res);
}

async function submitQuestCompletion(quality) {
  if (!active) return;
  const elapsed = Math.floor(getWorkElapsed(active));
  const isCount = (active.mode === 'countdown' || active.mode === 'pomodoro') && active.total > 0;
  const early = isCount && elapsed < active.total * 0.5;
  stopTimer();
  exitMiniModeIfNeeded();
  const qid = active.id;
  active = null;
  const res = await api().complete_quest(qid, elapsed, quality || 'good');
  if (!res.ok) { closeModal(); toast(res.error, true); return; }
  if (early) { playVoice('finish_early'); if (state.settings.notifications) toast('Bạn bấm hoàn thành khi mới qua dưới nửa thời gian đặt. Hãy chắc là bạn đã làm đủ.'); }
  showCompletionResultModal(res);
}

function showCompletionResultModal(res) {
  playVoice(res.ranked_up ? 'rank_up' : res.leveled_up ? 'level_up' : (res.gains || []).some((g) => g.leveled_up) ? 'stat_level_up' : res.debt_settled ? 'debt_cleared' : 'quest_complete');
  localSugg = localSugg ? localSugg.filter((x) => x !== undefined) : null;

  const qp = res.quality_penalty;
  let qpHtml = '';
  if (qp) {
    if (qp.triggered) {
      qpHtml = `<div class="panel" style="margin:12px auto 0;padding:10px 14px;border-color:var(--gold);text-align:left;max-width:480px">
        <b style="color:var(--gold)">⚖️ Giảm nhẹ hình phạt (${qp.reduced_by} cấp):</b>
        <p class="hint" style="margin:4px 0 0;color:var(--ice)">Lẽ ra nếu không làm sẽ bị phạt <b>${esc(qp.base_level_name)}</b>, nhưng vì bạn đã làm ở mức <b>${esc(qp.quality_label)}</b> nên được giảm nhẹ ${qp.reduced_by} cấp xuống <b>${esc(qp.level_name)}</b>.</p>
      </div>`;
    } else if (qp.exempted) {
      qpHtml = `<div class="panel" style="margin:12px auto 0;padding:10px 14px;border-color:#44e69e;text-align:left;max-width:480px">
        <b style="color:#44e69e">⚖️ Đã giảm nhẹ ${qp.reduced_by} cấp → Miễn hình phạt!</b>
        <p class="hint" style="margin:4px 0 0">Cấp phạt gốc (${esc(qp.base_level_name)}) sau khi giảm ${qp.reduced_by} cấp đã xuống dưới Cấp 1 nên bạn không bị phạt.</p>
      </div>`;
    }
  }
  const si = res.settle_info;
  let siHtml = '';
  if (si && si.action === 'downgraded') {
    siHtml = `<div class="panel" style="margin:12px auto 0;padding:10px 14px;border-color:var(--gold);text-align:left;max-width:480px">
      <b style="color:var(--gold)">⚖️ Đã giảm nhẹ ${si.reduced_by} cấp hình phạt!</b>
      <p class="hint" style="margin:4px 0 0;color:var(--ice)">Khoản phạt đã được hạ từ <b>${esc(si.old_level_name)}</b> xuống <b>${esc(si.new_level_name)}</b>.</p>
    </div>`;
  }
  if (si && si.unrestored_stats && si.unrestored_stats.length) {
    siHtml += `<div class="panel" style="margin:12px auto 0;padding:10px 14px;border-color:var(--edge);text-align:left;max-width:480px">
      <b style="color:var(--edge)">📌 Quy tắc tính điểm chân thật:</b>
      <p class="hint" style="margin:4px 0 0;color:var(--ice)">Hình phạt <b>"${esc(res.title)}"</b> không liên quan đến chỉ số <b>${esc(si.unrestored_stats.join(', '))}</b> nên không bù lại điểm chỉ số cũ đó — hệ thống chỉ gỡ nợ kỷ luật và cộng các chỉ số thực tế mà hình phạt này rèn luyện.</p>
    </div>`;
  }

  showModal(`<div class="reward-box">
    <h1>${res.breakthrough_unlocked ? '⚡ Đột phá Cảnh giới!' : (res.penalty ? 'Kết quả làm bù' : 'Hoàn thành quest')}</h1>
    <p class="sub" style="margin:0 auto">${esc(res.title)} <span class="chip ${res.quality === 'bad' ? 'warn' : (res.quality === 'great' ? 'ok' : 'hot')}" style="margin-left:6px">Chất lượng: ${esc(res.quality_label || 'Khá tốt')}</span></p>
    ${res.penalty ? '' : `<div class="big">+${res.points} điểm</div><div>+${res.xp} kinh nghiệm</div>`}
    ${res.goal_bonus ? `<div class="panel" style="margin:10px auto 0;padding:10px 14px;border-color:var(--gold);max-width:480px"><b style="color:var(--gold)">🏆 Chúc mừng hoàn thành trọn vẹn Mục tiêu lớn!</b><p class="hint" style="margin:4px 0 0">Đã cộng gộp phần thưởng Mục tiêu lớn (+${res.goal_bonus.points || 0} điểm thưởng) vào kết quả bên trên!</p></div>` : ''}
    ${qpHtml}${siHtml}
    ${res.leveled_up ? `<div class="lvup">Lên cấp ${res.level_after}</div>` : ''}
    ${res.ranked_up ? `<div class="lvup" style="color:var(--gold)">Thăng hạng: ${esc(res.rank_after)}</div>` : ''}
    ${res.blocked_rank && !res.ranked_up ? `<p class="hint" style="color:var(--gold);margin-top:8px">Bạn đã đủ cấp cho ${esc(res.blocked_rank)}. Hoàn thành Quest Đột phá để thăng hạng!</p>` : ''}
    ${res.debt_settled ? '<div class="lvup">Đã gỡ xong khoản nợ / hình phạt</div>' : ''}
    ${(res.restored || []).length ? `<div class="gains">${res.restored.map((g) => `<span class="chip ok">Hoàn lại +${g.amount} ${esc(g.name)}</span>`).join('')}</div>` : ''}
    ${res.gains.length ? `<div class="gains">${res.gains.map((g) => `<span class="chip ok">+${g.amount} ${esc(g.name)}${g.leveled_up ? ' (lên Lv.' + g.level_after + ')' : ''}</span>`).join('')}</div>` : ''}
    <div class="modal-foot" style="justify-content:center">
      ${res.can_undo ? `<button class="btn ghost" onclick="undoLastAction()">Hoàn tác (Bấm nhầm)</button>` : ''}
      <button class="btn main" onclick="closeModal()">${res.penalty ? 'Đã hiểu' : 'Nhận thưởng'}</button>
    </div></div>`);
  if (res.ranked_up) levelFx('Thăng hạng: ' + res.rank_after, '#ffd36b');
  else if (res.leveled_up) levelFx('Lên cấp ' + res.level_after);
  refresh();
}

    breakthrough_rank: $('#qBtRank').value || null, title: $('#qTitle').value,

    deadline: ($('#qHasDeadline') && $('#qHasDeadline').checked && $('#qDeadline').value) ? $('#qDeadline').value : null, deadline_time: ($('#qHasDeadline') && $('#qHasDeadline').checked && $('#qDeadlineTime') && $('#qDeadlineTime').value) ? $('#qDeadlineTime').value : null, deadline_window: ($('#qHasDeadline') && $('#qHasDeadline').checked && $('#qDeadlineWin') && $('#qDeadlineWin').value) ? $('#qDeadlineWin').value : null, scheduled_date: $('#qSched').value || null, next_due: (rep && $('#qNextDue') && $('#qNextDue').value) ? $('#qNextDue').value : null,

}

function twoStep(btn, sure, action) {
  if (btn.dataset.sure === '1') { btn.dataset.sure = ''; return action(); }
  const old = btn.textContent;
  btn.dataset.sure = '1'; btn.textContent = sure;
  setTimeout(() => { if (btn.isConnected && btn.dataset.sure === '1') { btn.dataset.sure = ''; btn.textContent = old; } }, 3000);
}

async function useItem(invId, targetId = null) {
  const r = await api().use_item(invId, targetId);
  if (!r.ok) {
    if (r.need_target === 'quest') {
      openSkipQuestModal(r);
      return;
    }
    if (r.need_target === 'punish') {
      openPunishTargetModal(r);
      return;
    }
    if (r.results && r.results.length) showUseResults('Chưa dùng được', r.results, r.error);
    else toast(r.error, true);
    return;
  }
  closeModal();
  playVoice(['skip_ticket', 'skip_quest'].includes(r.effect) ? 'skip_used' : (['punish_immune', 'reduce_punish'].includes(r.effect) ? 'debt_cleared' : 'item_use'));
  if (r.message) toast(r.message);
  else if (r.results && r.results.length) showUseResults('Đã dùng: ' + r.name, r.results, '');
  else toast('Đã dùng ' + r.name + '. Tận hưởng nhé.');
  localSugg = null;
  refresh();
}

function levelFx(text, color) {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const fx = document.createElement('div');
  fx.id = 'fx'; fx.style.setProperty('--fc', color || '#35c8ff');
  let sparks = '';
  for (let i = 0; i < 26; i++) sparks += `<i class="spark" style="left:${(Math.random() * 100).toFixed(1)}%;animation-delay:${(Math.random() * 0.8).toFixed(2)}s;animation-duration:${(1.4 + Math.random()).toFixed(2)}s"></i>`;
  fx.innerHTML = `<div class="flash"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div>${sparks}<div class="txt">${esc(text)}</div>`;
  document.body.appendChild(fx);
  setTimeout(() => fx.remove(), 2800);
}

function goView(v) {

function maybeShowDecay() {
  if (isQuiet()) return;
  const d = state.decay_unseen || [], m = state.miss_unseen || [], e = state.expired_unseen || [];
  if (!(d.length || m.length || e.length) || active || !$('#modal').classList.contains('hidden')) return;
  state.decay_unseen = []; state.miss_unseen = []; state.expired_unseen = [];
  api().ack_alerts();              // đánh dấu đã báo, không hiện lại
  const bad = d.length || m.length;
  if (m.length) playVoice('debt_created');
  if (d.length) playVoice('decay');
  if (e.length) playVoice('quest_expired');
  if (bad) levelFx('Cảnh báo hệ thống', '#ff5a6e');
  showModal(`<div class="reward-box"><h1 style="color:${bad ? 'var(--alert)' : 'var(--edge)'}">${bad ? 'Cảnh báo hệ thống' : 'Thông báo'}</h1>

      <ul class="acts" style="text-align:left">${m.map((x) => `<li><span class="k" style="color:var(--alert)">${esc(x.level)}</span><span class="t">${esc(x.quest)} (${fmtDay(x.day)})${x.lost.length ? ': ' + x.lost.map((l) => '-' + l.lost + ' ' + esc(l.stat)).join(', ') : ''}</span></li>`).join('')}</ul>
      <p class="hint">Cửa hàng và gacha bị khóa cho tới khi bạn gỡ hết nợ ở màn hình Hôm nay.</p>` : ''}
    ${d.length ? `<p class="sub" style="margin:6px auto">Chỉ số bị trừ điểm vì quá lâu không được luyện:</p>
      <ul class="acts" style="text-align:left">${d.map((x) => `<li><span class="k" style="color:var(--alert)">-${x.lost}</span><span class="t">${esc(x.stat)}</span></li>`).join('')}</ul>` : ''}

/* ================= lịch tuần ================= */
const WD = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
const isoLocal = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
function calShift(n) {
  if (n === 0) calWeek = null;
  else { const d = new Date((calWeek || state.date) + 'T00:00:00'); d.setDate(d.getDate() + n); calWeek = isoLocal(d); }
  renderCalendar();
}
function calDefaultDay() {
  if (!calData) return null;
  const d = calData.days.find((x) => !x.is_past);
  return d ? d.date : null;
}
function calBlock(it, day) {
  const act = (label, fn) => `<button type="button" onclick="event.stopPropagation();${fn}">${label}</button>`;
  const estTxt = it.estimate ? ` • ${it.estimate}p` : '';
  if (it.kind === 'scheduled' || it.kind === 'due') {
    const movable = !day.is_past && !it.done;
    return `<div class="blk ${it.kind}" ${movable ? `draggable="true" ondragstart="calDrag(event,${it.quest_id})"` : ''} tabindex="0" onclick="openQuest(${it.quest_id})" title="Bấm để xem, kéo sang ngày khác để đổi ngày">
      <span>${esc(it.title)}</span>
      <small>${it.kind === 'due' ? 'Dự kiến theo chu kỳ lặp' : (it.windows.length ? esc(it.windows.join(', ')) : 'Mọi lúc')}${estTxt}${it.done ? ', đã xong' : ''}</small>
      <span class="bt">${act('Sửa', `openEditor(${it.quest_id})`)}${act('Nhân bản', `duplicateQuest(${it.quest_id})`)}${movable ? act('Chuyển ngày', `moveModal(${it.quest_id})`) : ''}</span></div>`;
  }
  if (it.kind === 'exam_day') return `<div class="blk exam-day" onclick="openExamModal(${it.exam_id})" style="cursor:pointer" title="Bấm để xem hoặc sửa lịch ôn kiểm tra"><span>${esc(it.title)}</span><small style="color:var(--ice)">${esc(it.sub)}</small></div>`;
  if (it.kind === 'exam_session') return `<div class="blk exam-sess" onclick="openQuest(${it.quest_id})" title="Buổi ôn trong lộ trình kiểm tra"><span>${esc(it.title)}</span><small>${esc((it.windows || []).join(', '))}${estTxt}</small></div>`;
  if (it.kind === 'draft') return `<div class="blk draft"><span>${esc(it.title)}</span><small>Nháp của trợ lý${estTxt}</small><span class="bt">${act('Chốt', `confirmDraft(${it.quest_id}, '${day.date}')`)}${act('Bỏ', `discardDraft(${it.quest_id}, '${day.date}')`)}</span></div>`;
  if (it.kind === 'done') return `<div class="blk done">Xong: ${esc(it.title)}</div>`;
  return `<div class="blk missed">Bỏ lỡ: ${esc(it.title)}</div>`;
}

function calDayCapHtml(d) {
  if (d.free_min === null || d.free_min === undefined) {
    return d.planned_min ? `<div class="calcap">Dự kiến: ${d.planned_min}p</div>` : '';
  }
  const pct = d.free_min > 0 ? Math.min(100, Math.round((d.planned_min / d.free_min) * 100)) : (d.planned_min > 0 ? 100 : 0);
  const cls = d.overload ? 'over' : (pct >= 80 ? 'warn' : '');
  return `<div class="calcap ${d.overload ? 'over' : ''}">${d.planned_min}p / ${d.free_min}p rảnh${d.overload ? ' (Quá tải!)' : ''}
    <div class="calcap-bar ${cls}"><i style="width:${pct}%"></i></div></div>`;
}

async function renderCalendar() {
  const data = await api().get_calendar(calWeek || state.date);
  if (currentView !== 'calendar') return;
  calData = data; calWeek = data.week_start;
  const pool = data.pool.map((p) => `<div class="blk" draggable="true" ondragstart="calDrag(event,${p.quest_id})" tabindex="0" onclick="openQuest(${p.quest_id})">
      <span>${esc(p.title)}</span><small>${p.windows.length ? esc(p.windows.join(', ')) : 'Mọi lúc'}${p.estimate ? ' • ' + p.estimate + 'p' : ''}</small>
      <span class="bt"><button type="button" onclick="event.stopPropagation();openEditor(${p.quest_id})">Sửa</button><button type="button" onclick="event.stopPropagation();duplicateQuest(${p.quest_id})">Nhân bản</button><button type="button" onclick="event.stopPropagation();moveModal(${p.quest_id})">Chuyển ngày</button></span></div>`).join('');
  $('#view').innerHTML = `
    <div class="row between" style="flex-wrap:wrap"><div><h1>Lịch tuần</h1>
      <p class="sub">${fmtDay(data.days[0].date)} - ${fmtDay(data.days[6].date)}. Kéo block sang cột ngày khác để đổi ngày. Thanh dung lượng trên mỗi ngày đối chiếu tổng thời gian quest dự kiến với giờ rảnh trong Lịch của tôi.</p></div>
      <div class="row" style="flex-wrap:wrap"><button class="btn sm" onclick="calShift(-7)">Tuần trước</button><button class="btn sm" onclick="calShift(0)">Tuần này</button><button class="btn sm" onclick="calShift(7)">Tuần sau</button>
        <button class="btn sm ghost" onclick="autoBalanceWeek()" title="Trợ lý tự động xếp lại khung giờ ôn thi và dời bớt quest ở ngày quá tải sang ngày còn trống">🤖 Tự cân bằng lịch</button>
        <button class="btn sm main" onclick="openExamModal()">📝 Báo có kiểm tra</button><button class="btn main" onclick="openEditor(null, null, calDefaultDay())">Tạo quest</button></div></div>
    <div class="cal">
      <aside class="calpool panel" ondragover="calOver(event)" ondragleave="calLeave(event)" ondrop="calDrop(event, null)">
        <h3>Chưa xếp lịch</h3>${pool || '<p class="hint">Không còn quest nào chưa xếp lịch.</p>'}
        <p class="hint">Thả block vào đây để bỏ xếp lịch.</p></aside>
      <div class="calgrid">${data.days.map((d) => `
        <section class="calday panel ${d.is_today ? 'today' : ''} ${d.is_past ? 'past' : ''}" ${d.is_past ? '' : `ondragover="calOver(event)" ondragleave="calLeave(event)" ondrop="calDrop(event, '${d.date}')"`}>
          <header><span><b>${WD[d.weekday]}</b><span>${fmtDay(d.date)}</span></span>${d.items.some((i) => i.kind === 'draft') ? `<button type="button" class="btn sm main plus" onclick="confirmAllDrafts('${d.date}')">Chốt hết</button>` : ''}${d.is_past ? '' : `<button type="button" class="btn sm ghost plus" aria-label="Tạo quest cho ngày ${fmtDay(d.date)}" onclick="openEditor(null, null, '${d.date}')">+</button>`}</header>
          ${calDayCapHtml(d)}
          ${d.items.map((it) => calBlock(it, d)).join('')}
        </section>`).join('')}</div>
    </div>`;
}
function calDrag(e, qid) { dragId = qid; e.dataTransfer.setData('text/plain', String(qid)); e.dataTransfer.effectAllowed = 'move'; }
function calOver(e) { e.preventDefault(); e.currentTarget.classList.add('over'); }
function calLeave(e) { e.currentTarget.classList.remove('over'); }
async function calDrop(e, day) {
  e.preventDefault(); e.currentTarget.classList.remove('over');
  const qid = dragId || +e.dataTransfer.getData('text/plain');
  dragId = null;
  if (!qid) return;
  await scheduleTo(qid, day);
}
async function scheduleTo(qid, day) {
  if (day && day < state.date) return toast('Không xếp lịch cho ngày đã qua.', true);
  const r = await api().schedule_quest(qid, day);
  if (!r.ok) return toast(r.error, true);
  localSugg = null;
  await refresh();
}
async function autoBalanceWeek() {
  const r = await api().auto_balance_week(calWeek || state.date);
  if (!r.ok) return toast(r.error || 'Không cân bằng được lịch.', true);
  localSugg = null;
  const mv = r.moved || [];
  if (mv.length) {
    toast(`🤖 Trợ lý đã tự dời ${mv.length} quest từ ngày quá tải sang ngày còn trống: ${mv.map((x) => x.title + ' → ' + fmtDay(x.to)).join(', ')}.`);
  } else {
    toast('🤖 Đã tối ưu lại các khung giờ trống trong tuần.');
  }
  await refresh();
}
function moveModal(qid) {
  const q = byId(qid);
  showModal(`<h1>Chuyển ngày</h1><p class="sub">${esc(q.title)}</p>
    <label class="f" style="margin-top:12px">Xếp vào ngày<input type="date" id="mvDay" min="${state.date}" value="${q.scheduled_date || state.date}"></label>
    <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Hủy</button>
      <button class="btn" onclick="closeModal();scheduleTo(${qid}, null)">Bỏ xếp lịch</button>
      <button class="btn main" onclick="const d=$('#mvDay').value;closeModal();scheduleTo(${qid}, d || null)">Xếp lịch</button></div>`);

/* ================= mục tiêu ================= */
const rewardChips = (pts, stats) => [pts ? `<span class="chip">+${pts} điểm</span>` : '', ...(stats || []).map((s) => `<span class="chip ok">+${s.amount} ${esc(s.name)}</span>`)].join('');
function goalCard(g) {
  const pct = Math.round(g.progress * 100);

/* ================= thống kê, biểu đồ radar & nhật ký hoàn thành ================= */
function radarSvgHtml(radar) {
  if (!radar || radar.length < 3) {
    return `<div style="padding:18px">${(radar || []).map((r) => `<div style="margin-bottom:10px"><b>${esc(r.name)}</b>: Lv.${r.avg_level} (${r.total_value} điểm)</div>`).join('') || '<p class="hint">Cần ít nhất 3 nhóm chỉ số để vẽ biểu đồ Radar.</p>'}</div>`;
  }
  const n = radar.length;
  const cx = 150, cy = 135, radius = 92;
  const maxVal = Math.max(5, ...radar.map((r) => r.total_value));
  const pt = (idx, ratio) => {
    const ang = -Math.PI / 2 + (2 * Math.PI * idx) / n;
    return [cx + radius * ratio * Math.cos(ang), cy + radius * ratio * Math.sin(ang)];
  };
  let rings = '';
  [0.25, 0.5, 0.75, 1].forEach((r) => {
    const pts = radar.map((_, i) => pt(i, r).map((v) => v.toFixed(1)).join(',')).join(' ');
    rings += `<polygon points="${pts}" fill="none" stroke="rgba(53,200,255,${r === 1 ? '0.35' : '0.14'})" stroke-width="1"/>`;
  });
  let axes = '', labels = '';
  radar.forEach((g, i) => {
    const [x, y] = pt(i, 1);
    const [lx, ly] = pt(i, 1.24);
    axes += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(53,200,255,0.2)" stroke-width="1"/>`;
    const anchor = Math.abs(lx - cx) < 10 ? 'middle' : (lx > cx ? 'start' : 'end');
    labels += `<text x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" fill="#dff4ff" font-size="12" text-anchor="${anchor}" font-family="Bahnschrift, sans-serif">${esc(g.name)} (${g.total_value})</text>`;
  });
  const dataPts = radar.map((g, i) => pt(i, Math.max(0.08, Math.min(1, g.total_value / maxVal))).map((v) => v.toFixed(1)).join(',')).join(' ');
  const dots = radar.map((g, i) => {
    const [dx, dy] = pt(i, Math.max(0.08, Math.min(1, g.total_value / maxVal)));
    return `<circle cx="${dx.toFixed(1)}" cy="${dy.toFixed(1)}" r="3.5" fill="#35c8ff" stroke="#fff" stroke-width="1"/>`;
  }).join('');
  return `<svg viewBox="0 0 300 270" width="100%" height="260" aria-label="Biểu đồ cân bằng nhóm chỉ số">
    ${rings}${axes}
    <polygon points="${dataPts}" fill="rgba(53,200,255,0.24)" stroke="#35c8ff" stroke-width="2"/>
    ${dots}${labels}
  </svg>`;
}

let currentTtsAudio = null;

function stopTtsSpeaking() {
  ttsStreamToken++;
  while (voiceQueue.length > 0) {
    const it = voiceQueue.shift();
    if (it && it.resolve) it.resolve();
  }
  if (currentMasterAudio) {
    try { currentMasterAudio.pause(); currentMasterAudio.src = ''; } catch (e) {}
    currentMasterAudio = null;
  }
  if (currentTtsAudio) {
    try { currentTtsAudio.pause(); currentTtsAudio.src = ''; } catch (e) {}
    currentTtsAudio = null;
  }
  nowPlaying = '';
  lastAudioEndedAt = 0;
  showTtsStopBar(false);
}

function playDataAudioUrl(dataUrl, label = 'Trợ lý đang đọc...', token = null) {
  if (!dataUrl) return Promise.resolve();
  return enqueueMasterAudio({
    kind: 'data_url',
    dataUrl,
    label,
    token,
  });
}

function splitSentencesForTts(text) {
  let clean = String(text || '')
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/^[^a-zA-Z0-9À-ỹ]*\[(?:HỆ THỐNG[^\]]*|Tính cách[^\]]*|SYSTEM[^\]]*)\]\s*:?\s*/i, '')
    .replace(/\b(\d+)\s*đ\b/g, '$1 điểm')
    .replace(/→|->/g, ' sang ')
    .replace(/[*_#>`~•]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  if (!clean) return [];
  const rawParts = clean.split(/(?<=[.!?…。！？])\s+/);
  const chunks = [];
  let buf = '';
  for (const p of rawParts) {
    if ((buf + ' ' + p).trim().length <= 170) {
      buf = (buf ? buf + ' ' : '') + p;
    } else {
      if (buf) chunks.push(buf.trim());
      buf = p;
    }
  }
  if (buf.trim()) chunks.push(buf.trim());
  return chunks.slice(0, 8);
}

async function speakCustomText(text, silentToast = false, voiceOverride = null, cancelPreviousTts = true) {
  const sentences = splitSentencesForTts(text);
  if (!sentences.length) return;
  if (cancelPreviousTts) {
    // Chỉ hủy các câu TTS cũ còn tồn đọng nhưng giữ nguyên hàng đợi âm thanh sự kiện đang phát để không bao giờ đè tiếng
    ttsStreamToken++;
    for (let i = voiceQueue.length - 1; i >= 0; i--) {
      if (voiceQueue[i].kind !== 'event') {
        const removed = voiceQueue.splice(i, 1)[0];
        if (removed && removed.resolve) removed.resolve();
      }
    }
  }
  const myToken = ++ttsStreamToken;
  if (!silentToast) toast('🔊 Trợ lý đang chuẩn bị giọng nói...');

  // Khởi tạo câu đầu tiên ngay, và trong khi câu i đang phát trong hàng đợi tuần tự (có delay 1s), tổng hợp ngầm câu i+1
  let nextPromise = api().tts_speak_text(sentences[0], voiceOverride);
  for (let i = 0; i < sentences.length; i++) {
    if (myToken !== ttsStreamToken) break;
    const curRes = await nextPromise;
    if (myToken !== ttsStreamToken) break;
    if (i + 1 < sentences.length) {
      nextPromise = api().tts_speak_text(sentences[i + 1], voiceOverride);
    }
    if (!curRes || !curRes.ok || !curRes.audio_url) {
      // Trên điện thoại hoặc khi không có file âm thanh cục bộ, tự động đọc bằng Giọng Tiếng Việt có sẵn của trình duyệt/Android (0 MB)
      const okNative = await speakBrowserViTts(sentences[i]);
      if (!okNative && !silentToast && curRes && curRes.error) toast(curRes.error, true);
      continue;
    }
    await playDataAudioUrl(curRes.audio_url, `🔊 Trợ lý đang đọc (${i + 1}/${sentences.length})...`, myToken);
  }
}

async function speakDailyBriefing(silentIfErr = false) {
  const btn = $('#btnDailyBriefing');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Đang đọc báo cáo...'; }
  try {
    const r = await api().tts_build_daily_briefing();
    if (!r.ok) {
      if (!silentIfErr) toast(r.error, true);
      return;
    }
    if (r.audio_url) {
      await playDataAudioUrl(r.audio_url, '🔊 Trợ lý đang báo cáo nhiệm vụ khung giờ hiện tại...');
    } else if (r.briefing_text) {
      await speakCustomText(r.briefing_text, true, null, false);

function encodeMonoWav16k(float32Samples, srcSampleRate) {
  if (!float32Samples || !float32Samples.length) return null;
  const targetRate = 16000;
  let samples = float32Samples;
  if (srcSampleRate !== targetRate) {
    const ratio = srcSampleRate / targetRate;
    const newLen = Math.max(1, Math.round(float32Samples.length / ratio));
    samples = new Float32Array(newLen);
    for (let i = 0; i < newLen; i++) {
      const srcIdx = i * ratio;
      const idx0 = Math.floor(srcIdx);
      const idx1 = Math.min(float32Samples.length - 1, idx0 + 1);
      const frac = srcIdx - idx0;
      samples[i] = float32Samples[idx0] * (1 - frac) + float32Samples[idx1] * frac;
    }
  }

  // Cắt khoảng lặng thừa ở đầu và cuối (giữ 120ms đầu và 160ms đuôi để không mất âm đầu/cuối)
  const frameLen = 160; // 10ms @ 16kHz
  let maxPeak = 0;
  for (let i = 0; i < samples.length; i++) {
    const a = Math.abs(samples[i]);
    if (a > maxPeak) maxPeak = a;
  }
  if (maxPeak < 0.006) return null; // Hoàn toàn im lặng

  const trimThresh = Math.max(0.008, maxPeak * 0.08);
  let startIdx = 0;
  let endIdx = samples.length;
  for (let i = 0; i < samples.length; i += frameLen) {
    let sum = 0;
    const lim = Math.min(samples.length, i + frameLen);
    for (let j = i; j < lim; j++) sum += Math.abs(samples[j]);
    if (sum / (lim - i) >= trimThresh) {
      startIdx = Math.max(0, i - 1920); // giữ 120ms trước âm đầu tiên
      break;
    }
  }
  for (let i = samples.length - frameLen; i >= startIdx; i -= frameLen) {
    let sum = 0;
    const lim = Math.min(samples.length, i + frameLen);
    for (let j = i; j < lim; j++) sum += Math.abs(samples[j]);
    if (sum / (lim - i) >= trimThresh) {
      endIdx = Math.min(samples.length, lim + 2560); // giữ 160ms sau âm cuối cùng
      break;
    }
  }
  const trimmed = samples.subarray(startIdx, endIdx);
  if (trimmed.length < 2400) return null; // Quá ngắn (< 0.15s)

  // Chuẩn hóa biên độ âm thanh (Peak Normalization) nếu mic nhỏ để faster-whisper nghe rõ 100%
  const gain = (maxPeak > 0.015 && maxPeak < 0.55) ? (0.82 / maxPeak) : 1.0;

  const buffer = new ArrayBuffer(44 + trimmed.length * 2);
  const view = new DataView(buffer);
  const writeStr = (offset, str) => {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  };
  writeStr(0, 'RIFF');
  view.setUint32(4, 36 + trimmed.length * 2, true);
  writeStr(8, 'WAVE');
  writeStr(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);   // PCM = 1
  view.setUint16(22, 1, true);   // Mono = 1 channel
  view.setUint32(24, targetRate, true);
  view.setUint32(28, targetRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeStr(36, 'data');
  view.setUint32(40, trimmed.length * 2, true);

  let offset = 44;
  for (let i = 0; i < trimmed.length; i++, offset += 2) {
    const s = Math.max(-1, Math.min(1, trimmed[i] * gain));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }

  const bytes = new Uint8Array(buffer);
  let binary = '';
  const chunkSz = 0x8000;
  for (let i = 0; i < bytes.length; i += chunkSz) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSz));
  }
  return 'data:audio/wav;base64,' + btoa(binary);
}

function eventToHotkeyString(e) {
  if (!e) return '';
  if (['Control', 'Alt', 'Shift', 'Meta'].includes(e.key)) return '';
  const mods = [];
  if (e.ctrlKey || e.metaKey) mods.push('Ctrl');
  if (e.altKey) mods.push('Alt');
  if (e.shiftKey) mods.push('Shift');
  let keyName = '';
  if (e.code === 'Space' || e.key === ' ') keyName = 'Space';
  else if (e.code === 'Backquote' || e.key === '`' || e.key === '~') keyName = 'Backquote';
  else if (/^F\d{1,2}$/i.test(e.key)) keyName = e.key.toUpperCase();
  else if (e.key && e.key.length === 1) keyName = e.key.toUpperCase();
  else keyName = e.code || e.key || '';
  if (!keyName) return '';
  return [...mods, keyName].join('+');
}

async function startFastPcmVadRecorder(targetInputId, btn, autoSend) {
  const inp = document.getElementById(targetInputId);
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    resetMicBtn(btn);
    sttActiveBtn = null;
    return toast('Thiết bị của bạn chưa bật Micro hoặc trình duyệt không hỗ trợ thu âm.', true);
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: {
        channelCount: 1,
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
      }
    });
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioCtx();
    const source = audioCtx.createMediaStreamSource(stream);
    const processor = audioCtx.createScriptProcessor(2048, 1, 1);
    const chunks = [];
    let totalSamples = 0;
    let hasSpoken = false;
    let speechFrames = 0;
    let lastVoiceTime = Date.now();
    const startTime = Date.now();
    const s = (state && state.settings) || {};
    const hkLabel = formatHotkeyLabel(s.stt_hotkey || 'Space');
    const autoVadOn = Boolean(s.stt_auto_vad);
    const silenceTimeoutMs = 1200;
    const maxNoSpeechMs = 15000;
    const maxRecordMs = 45000;
    let finished = false;
    let liveBusy = false;
    let lastLiveAt = 0;
    let lastLiveSamples = 0;
    const baseInputText = (inp && inp.value && inp.value.trim()) ? (inp.value.trim() + ' ') : '';

    // Dự phòng thêm Web Speech API nếu trình duyệt có hỗ trợ để hiện chữ tức thì khi chưa nạp faster-whisper
    let browserRec = null;
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    const hasLocalWhisper = Boolean(state && state.voice && state.voice.stt && state.voice.stt.has_whisper);
    if (SpeechRec && !hasLocalWhisper) {
      try {
        browserRec = new SpeechRec();
        browserRec.lang = 'vi-VN';
        browserRec.continuous = true;
        browserRec.interimResults = true;
        browserRec.onresult = (ev) => {
          if (finished || !inp) return;
          let interim = '';
          for (let i = 0; i < ev.results.length; i++) {
            interim += ev.results[i][0].transcript + ' ';
          }
          if (interim.trim()) {
            inp.value = baseInputText + interim.trim();
            inp.scrollLeft = inp.scrollWidth;
          }
        };
        browserRec.start();
      } catch (e) {
        browserRec = null;
      }
    }

    sttActiveBtn = btn;
    if (btn) {
      btn.classList.add('danger');
      btn.innerHTML = btn.id === 'btnAutoMic' ? '⏹️' : `⏹️ Ngắt (${hkLabel})`;
    }
    if (inp) {
      inp.dataset.oldPlaceholder = inp.placeholder || '';
      inp.placeholder = `🎙️ Đang thu âm... Hãy nói (Ấn [${hkLabel}] lần nữa để ngắt)`;
      inp.focus();
    }
    toast(`🎙️ Đang thu âm... Chữ sẽ hiện trực tiếp lên thanh chat. Ấn [${hkLabel}] lần nữa để ngắt!`);

    const cleanup = () => {
      if (browserRec) {
        try { browserRec.onresult = null; browserRec.stop(); } catch (e) {}
        browserRec = null;
      }
      try { processor.disconnect(); } catch (e) {}
      try { source.disconnect(); } catch (e) {}
      try { stream.getTracks().forEach((tr) => tr.stop()); } catch (e) {}
      try { if (audioCtx.state !== 'closed') audioCtx.close(); } catch (e) {}
      if (inp && inp.dataset.oldPlaceholder !== undefined) {
        inp.placeholder = inp.dataset.oldPlaceholder;
        delete inp.dataset.oldPlaceholder;
      }
      sttPcmSession = null;
    };

    const runLiveTranscribePreview = async () => {
      if (finished || liveBusy || !hasSpoken || !inp) return;
      if (totalSamples - lastLiveSamples < 3200) return;
      liveBusy = true;
      lastLiveAt = Date.now();
      lastLiveSamples = totalSamples;
      try {
        const sRate = audioCtx.sampleRate || 48000;
        const snapSamples = new Float32Array(totalSamples);
        let pos = 0;
        for (const c of chunks) {
          if (pos + c.length > snapSamples.length) break;
          snapSamples.set(c, pos);
          pos += c.length;
        }
        const wavB64 = encodeMonoWav16k(snapSamples, sRate);
        if (!wavB64 || finished) return;
        const r = await api().ai_transcribe_live(wavB64, 'audio/wav');
        if (!finished && r && r.ok && r.text) {
          inp.value = baseInputText + r.text;
          inp.scrollLeft = inp.scrollWidth;
        }
      } catch (e) {
        // Bỏ qua lỗi tạm thời trong lúc preview
      } finally {
        liveBusy = false;
      }
    };

    const finishRecording = async (cancelled = false) => {
      if (finished) return;
      finished = true;
      const sRate = audioCtx.sampleRate || 48000;
      cleanup();
      if (cancelled || !totalSamples) {
        resetMicBtn(btn);
        sttActiveBtn = null;
        return;
      }
      if (btn) btn.innerHTML = btn.id === 'btnAutoMic' ? '⏳' : '⏳...';

      const merged = new Float32Array(totalSamples);
      let pos = 0;
      for (const c of chunks) {
        merged.set(c, pos);
        pos += c.length;
      }
      const wavB64 = encodeMonoWav16k(merged, sRate);
      if (!wavB64) {
        resetMicBtn(btn);
        sttActiveBtn = null;
        if (inp && !inp.value.trim()) {
          return toast('Không phát hiện thấy giọng nói. Hãy nói to hơn một chút nhé!', true);
        }
        return;
      }

      try {
        const r = await api().ai_transcribe_audio(wavB64, 'audio/wav');
        if (!r.ok) {
          if (!inp || !inp.value.trim()) toast(r.error, true);
          return;
        }
        if (r.text && inp) {
          inp.value = baseInputText + r.text;
          inp.focus();
          try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch (e) {}
          inp.scrollLeft = inp.scrollWidth;
          toast(`🎤 Đã ngắt Mic (${r.engine || 'STT'}): "${r.text}"${autoSend ? ' — Đang gửi...' : ' — Ấn Enter để gửi!'}`);
          if (autoSend) {
            triggerAutoSendForInput(targetInputId);
          }
        }
      } finally {
        resetMicBtn(btn);
        sttActiveBtn = null;
      }
    };

    sttPcmSession = { finish: () => finishRecording(false), cancel: () => finishRecording(true), targetInputId };

    processor.onaudioprocess = (e) => {
      if (finished) return;
      const input = e.inputBuffer.getChannelData(0);
      const copy = new Float32Array(input.length);
      copy.set(input);
      chunks.push(copy);
      totalSamples += copy.length;

      let sumSq = 0;
      for (let i = 0; i < copy.length; i++) sumSq += copy[i] * copy[i];
      const rms = Math.sqrt(sumSq / copy.length);
      const now = Date.now();

      if (rms > 0.014) {
        speechFrames++;
        lastVoiceTime = now;
        if (speechFrames >= 2 && !hasSpoken) {
          hasSpoken = true;
        }
      } else if (autoVadOn && hasSpoken && (now - lastVoiceTime >= silenceTimeoutMs)) {
        finishRecording(false);
        return;
      }

      // Cập nhật chữ trực tiếp lên thanh chat mỗi ~650ms khi đang nói
      if (hasSpoken && !liveBusy && (now - lastLiveAt >= 650)) {
        runLiveTranscribePreview();
      }

      if (!hasSpoken && (now - startTime > maxNoSpeechMs)) {
        toast('Đã tự tắt Mic do chưa nghe thấy giọng nói.');
        finishRecording(true);
      } else if (now - startTime > maxRecordMs) {
        finishRecording(false);
      }
    };

    source.connect(processor);
    processor.connect(audioCtx.destination);
  } catch (err) {
    resetMicBtn(btn);
    sttActiveBtn = null;
    sttPcmSession = null;
    toast('Không truy cập được Micro: ' + err.message, true);
  }
}

// Tạm thời vô hiệu hóa phím tắt STT theo yêu cầu
if (false) document.addEventListener('keydown', (e) => {
  // 1. Nếu đang ở chế độ Gán phím tắt mới trong Cài đặt
  if (capturingMicHotkeyBtn) {
    e.preventDefault();
    e.stopPropagation();
    if (e.key === 'Escape') {
      capturingMicHotkeyBtn.textContent = '⌨️ Bấm để gán phím bất kỳ';
      capturingMicHotkeyBtn.classList.remove('danger');
      capturingMicHotkeyBtn = null;
      return;
    }
    const newHk = eventToHotkeyString(e);
    if (!newHk) return;
    const btnRef = capturingMicHotkeyBtn;
    capturingMicHotkeyBtn = null;
    btnRef.classList.remove('danger');
    btnRef.textContent = '⌨️ Bấm để gán phím bất kỳ';
    setSetting('stt_hotkey', newHk).then(() => {
      toast(`⌨️ Đã lưu phím tắt thu âm Mic mới: ${formatHotkeyLabel(newHk)}`);
      refresh({ resetInputs: true });
    });
    return;
  }

  if (isAppLocked() || e.repeat) return;

  const pressedHk = eventToHotkeyString(e);
  if (!pressedHk) return;
  const configuredHk = (state && state.settings && state.settings.stt_hotkey) || 'Space';
  const isConfiguredMatch = pressedHk.toLowerCase() === configuredHk.toLowerCase();
  const isAltSFallback = e.altKey && (e.key === 's' || e.key === 'S');

  if (!isConfiguredMatch && !isAltSFallback) return;

  // 2. Nếu ĐANG THU ÂM (sttPcmSession != null) -> Ấn phím tắt lần 2 sẽ NGẮT THU ÂM NGAY LẬP TỨC dù con trỏ đang ở thanh chat!
  if (sttPcmSession) {
    e.preventDefault();
    e.stopPropagation();
    sttPcmSession.finish();
    return;
  }

  // 3. Nếu CHƯA THU ÂM và phím tắt là phím đơn (ví dụ: Space):
  //    - Nếu người dùng đang gõ dở chữ trong một ô input/textarea (có sẵn ký tự) thì nhường phím Space để gõ dấu cách bình thường.
  //    - Nếu không đang gõ chữ (hoặc thanh chat đang trống rỗng), ấn Space sẽ BẮT ĐẦU THU ÂM NGAY!
  const ae = document.activeElement;
  const isSingleCharKey = !e.ctrlKey && !e.altKey && !e.metaKey && (pressedHk === 'Space' || pressedHk.length === 1);
  if (isSingleCharKey && isInputEl(ae)) {
    const isChatBar = ['autoCmdInp', 'aiChatInp', 'quickAiInp'].includes(ae.id);
    if (!isChatBar || (ae.value && ae.value.trim().length > 0)) {
      return; // Đang gõ chữ -> cho phép gõ dấu cách bình thường
    }
  }

  e.preventDefault();
  e.stopPropagation();

  if ($('#autoCmdInp') && $('#btnAutoMic')) {
    toggleVoiceInput('autoCmdInp', $('#btnAutoMic'), null);
  } else if ($('#aiChatInp') && $('#btnMicChat')) {
    toggleVoiceInput('aiChatInp', $('#btnMicChat'), null);
  } else {
    toggleQuickAiPop(true);
    setTimeout(() => {
      if ($('#quickAiInp')) toggleVoiceInput('quickAiInp', $('#btnQuickAiMic'), null);
    }, 60);
  }
}, true);

async function playWelcomeAndPreloadBriefing() {
  if (!state || isAppLocked()) return;
  const shouldBrief = !autoBriefingPlayed && state.settings && state.settings.tts_enabled && state.settings.tts_auto_briefing && !isQuiet();
  if (shouldBrief) autoBriefingPlayed = true;

  // 1. Bắt đầu tổng hợp ngầm báo cáo TTS nhiệm vụ khung giờ hiện tại NGAY TRONG LÚC phát lời chào chủ nhân!
  // Tạm tắt tự động nạp STT theo yêu cầu người dùng
  const briefingPromise = shouldBrief ? api().tts_build_daily_briefing().catch(() => null) : null;

  // 2. Đưa lời chào chủ nhân vào đầu Hàng đợi Âm thanh Tuần tự
  if (hasVoice('app_open') && state.settings.voice) {
    playVoice('app_open');
  } else if (state.settings.voice || state.settings.notifications) {
    welcomeChime();
    lastAudioEndedAt = Date.now() + 350;
  }

  // 3. Xếp ngay bản báo cáo TTS (đang tạo ngầm) vào Hàng đợi Âm thanh Tuần tự -> tự động đợi lời chào xong + nghỉ đúng 1s mới đọc!
  if (briefingPromise) {
    await enqueueMasterAudio({
      kind: 'tts_promise',
      promise: briefingPromise,
      label: '🔊 Trợ lý đang báo cáo nhiệm vụ khung giờ hiện tại...',
      silentToast: true,
      token: ttsStreamToken,
    });
  }
}

async function sendAiChat() {
  if (aiBusy) return;
  const inp = $('#aiChatInp');
  const msg = (inp && inp.value || '').trim();
  if (!msg) return toast('Hãy nhập nội dung tin nhắn.', true);
  aiBusy = true;
  viewDirty = false;
  if (inp) inp.value = '';
  const box = $('#aiChatBox');
  if (box) {
    box.insertAdjacentHTML('beforeend', `
      <div class="chat-msg user"><div class="row between" style="margin-bottom:4px;font-size:11.5px;color:var(--mist)"><b>Bạn</b><span>Vừa xong</span></div><div>${esc(msg)}</div></div>
      <div class="chat-msg assistant" id="aiPendingBubble"><div class="row between" style="margin-bottom:4px;font-size:11.5px;color:var(--mist)"><b>🤖 SYSTEM AI</b><span>Đang xử lý...</span></div><div>⏳ Trợ lý đang phân tích yêu cầu và cập nhật dữ liệu trong app...</div></div>
    `);
    box.scrollTop = box.scrollHeight;
  }
  if ($('#btnSendAi')) { $('#btnSendAi').disabled = true; $('#btnSendAi').textContent = 'Đang xử lý...'; }
  try {
    const r = await api().ai_chat(msg, true);
    aiBusy = false;
    if (!r.ok) {
      const pb = $('#aiPendingBubble');
      if (pb) pb.innerHTML = `<b style="color:var(--alert)">⚠️ Lỗi:</b> ${esc(r.error)}`;
      toast(r.error, true);
      return;
    }
    localSugg = null;
    if (r.executed && r.executed.length) {
      toast('🤖 Đã tự động thực hiện ' + r.executed.length + ' thay đổi: ' + r.executed.join(' • '));
    }
    if (r.shop_tab) shopTab = r.shop_tab;
    if (r.quest_tab) questTab = r.quest_tab;
    if (r.settings_tab) settingsTab = r.settings_tab;
    if (r.open_view && currentView !== 'ai') {
      currentView = r.open_view;
      document.querySelectorAll('.nav').forEach((x) => x.classList.toggle('on', x.dataset.view === currentView));
    }
    await refresh({ resetInputs: true });
    if (r.start_quest_id && byId(r.start_quest_id)) {
      startQuest(r.start_quest_id);
    }
    if (state && state.settings && state.settings.tts_enabled && state.settings.tts_read_ai && r.reply) {
      speakCustomText(r.reply, true, null, false);
    }
    if ($('#aiChatInp')) $('#aiChatInp').focus();
  } catch (err) {
    aiBusy = false;
    toast('Lỗi kết nối Trợ lý AI: ' + err, true);
  } finally {
    aiBusy = false;
    if ($('#btnSendAi') && $('#btnSendAi').isConnected) { $('#btnSendAi').disabled = false; $('#btnSendAi').textContent = 'Gửi cho AI'; }
  }
}
